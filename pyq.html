<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8523a">
<title>孟卉的朋友圈工作台 · 每日发布</title>
<style>
  :root{
    --p:#e8523a;--a:#d63031;--g:#f0932b;--bg:#fff5f2;--card:#fff;
    --t:#2c2c2c;--tl:#9a9a9a;--bd:#fce4dc;--sb:env(safe-area-inset-bottom,0px);
    --ok:#2e9e5b;--okb:#eefaf1
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--t);line-height:1.72;
    padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(40px + var(--sb))}
  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 2px 10px}
  .ttl{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
  .ttl h1{font-size:19px;font-weight:800}
  .ttl h1 .dot{color:var(--p)}
  .date{font-size:12px;color:var(--tl)}
  .sub{font-size:12px;color:var(--tl);margin-top:2px}
  .remind-btn{background:var(--p);color:#fff;border:none;border-radius:18px;
    padding:7px 14px;font-size:12.5px;font-weight:600;box-shadow:0 4px 12px rgba(232,82,58,.25)}
  .remind-btn:active{transform:scale(.96)}
  .remind-btn.on{background:#fff;color:var(--p);border:1px solid var(--p)}

  .idea{margin-top:11px;background:var(--card);border:1px solid var(--bd);border-radius:14px;
    padding:11px 12px}
  .idea label{font-size:12.5px;color:var(--p);font-weight:600}
  .idea textarea{width:100%;border:none;resize:none;font-size:13.5px;margin-top:6px;
    font-family:inherit;color:var(--t);background:transparent;outline:none;line-height:1.6}
  .idea .row{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
  .idea .save{background:var(--bd);color:var(--p);border:none;border-radius:14px;
    padding:6px 14px;font-size:12.5px;font-weight:600}
  .idea .hint{font-size:11.5px;color:var(--tl)}

  .timeline{margin-top:13px;display:flex;flex-direction:column;gap:0}
  .tl-item{display:flex;align-items:flex-start;gap:10px;padding:7px 2px}
  .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--bd);margin-top:6px;flex-shrink:0}
  .tl-item.done .tl-dot{background:var(--ok)}
  .tl-item.now .tl-dot{background:var(--p);box-shadow:0 0 0 4px rgba(232,82,58,.18)}
  .tl-time{font-size:12px;color:var(--tl);width:38px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .tl-label{font-size:13px}
  .tl-item.done .tl-label{color:var(--ok);text-decoration:line-through;opacity:.7}
  .tl-item.now .tl-label{color:var(--p);font-weight:600}

  main{display:flex;flex-direction:column;gap:13px;margin-top:14px}
  .post{background:var(--card);border-radius:16px;padding:14px 14px 10px;
    border:1px solid var(--bd);box-shadow:0 4px 14px rgba(232,82,58,.05);position:relative}
  .post.flash{animation:flash 1.4s ease}
  @keyframes flash{0%,100%{box-shadow:0 4px 14px rgba(232,82,58,.05)}
    30%{box-shadow:0 0 0 3px rgba(232,82,58,.4);border-color:var(--p)}}
  .post .slot{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .post .tag{font-size:11px;color:var(--p);background:#fce4dc;padding:2px 9px;border-radius:9px}
  .post .st{font-size:11px;color:var(--tl)}
  .post .st.sent{color:var(--ok)}
  .post img{width:100%;border-radius:11px;margin:9px 0 3px;display:block;max-height:240px;object-fit:cover;background:var(--bg)}
  .post .txt{font-size:15px;white-space:pre-wrap;word-break:break-word;margin-top:4px}
  .post .shot{font-size:12px;color:var(--tl);margin-top:8px;padding:7px 10px;
    background:var(--bg);border-radius:9px;border:1px dashed var(--bd)}
  .post .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
  .post button{border-radius:15px;padding:6px 13px;font-size:12.5px;font-weight:600;background:none}
  .copy{border:1px solid var(--bd);color:var(--p)}
  .copy.ok{color:var(--ok);border-color:#bfe9cf;background:var(--okb)}
  .sent-btn{border:1px solid var(--okb);color:var(--ok);background:var(--okb)}
  .sent-btn.on{background:var(--ok);color:#fff;border-color:var(--ok)}

  footer{margin-top:24px;text-align:center;color:var(--tl);font-size:11px;line-height:1.8}
  .toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);
    background:var(--t);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="ttl">
    <h1>孟卉的朋友圈<span class="dot">.</span></h1>
    <span class="date" id="date"></span>
  </div>
  <div class="sub">每日发布系统 · 早感悟 / 直播预告 / 午吃 / 下午硬核×2 / 晚碎片</div>

    <button class="remind-btn" id="remindBtn" onclick="toggleRemind()">开启提醒</button>

  <div class="idea">

    <div class="row">
      <span class="hint" id="ideaHint">本地保存，仅此设备</span>
      <button class="save" onclick="saveIdea()">保存想法</button>
    </div>
  </div>
</header>

<div class="timeline" id="timeline"></div>

<main id="feed"></main>

<footer>
  内容基于你的真实生活（董教练·康复教练 / 99·董冬冬 / 锵锵·图图·胡啦·黑煤球）<br>
  每天打开本页，按提醒节奏发圈，形成正向循环。

<script>
// ===== 真实素材库（孟卉的真实生活）=====
// 老公：董教练（小9岁，康复教练，在一起13年）
// 儿子：99（大名董冬冬，2024.3.9生，两岁半）
// 宠物：边牧锵锵11岁 / 史宾格图图10岁 / 柯基胡啦7岁 / 玳瑁猫黑煤球12岁
// 自己：孟卉230斤、爱做饭、省钱记账、读书但不立人设、狼人杀麻将、不爱运动
// 工作：保险12年，泰康(2015.3)→明亚(2021)，每天9点直播讲养老基础逻辑

const MORNING = [
  "把『做完』和『做好』分开之后，生活轻了。前者只是清空清单，后者才真正攒下能力。今天我把最难的那件先啃了，一整天都松快。所谓内核稳，不是没情绪，是把确定性攥在自己手里——再乱，也先完成那件『做了就安心』的事，其余的焦虑会自动退场。以前总追求『全部搞定』，现在明白，真正的高效不是清空清单，而是分清轻重缓急，把最重要的事先做透，剩下的自然会跟着顺起来。生活不是短跑，是马拉松，别一上来就冲刺，要懂得分配体力和节奏。",
  "今天试着把『比较』这个开关关了一天。不看别人朋友圈的高光，只问自己：比上周进步了吗？答案居然是肯定的。横向比较制造焦虑，纵向比较制造踏实。成长是自己和自己的事，把尺子从别人身上拿回来，脚步反而更稳更轻。少看一眼别人的生活，就多攒一分自己的力气。说实话，关掉比较的那天，我突然觉得时间变多了、焦虑变少了。原来很多痛苦不是来自『我不够好』，而是来自『我觉得别人比我好』。这把尺子，早该放下了。",
  "今天重读一句话：你怎样对待时间，时间就怎样回馈你。不是鸡汤，是因果。刷手机的两小时不会消失，它会变成你没写的方案、没动的身体、没读的书，写进明天的你。把时间当资产而不是消耗品，是今年最值的一个认知升级。我开始记录每天的时间去向，光是『看见』就吓一跳——原来有那么多碎片被无意识消耗了。把它们捡回来，哪怕每天只捡回半小时，一年就是一百八十多个小时，足够读完十几本书。时间不是不够用，是没被看见。",
  "这两天在练『把目标小到不可能失败』。想锻炼就先做一个俯卧撑，想读书就先翻开一页。神奇的是，开始了往往就停不下来。意志力靠不住，靠的是降低启动门槛。今天又是被『先做一点点』救活的一天——大事，都是从小到不痛苦的那一步滚出来的。以前总定宏大的目标，结果三天就放弃，因为目标太大反而让人望而生畏。现在我把每个大目标都拆成『五分钟能开始』的小动作，反而越做越多。不是你不自律，是目标定错了尺寸。",
  "今天把『拒绝』当成一个完整句子，不再道歉三连。不是冷漠，是清楚自己的优先级。精力是有限的电池，乱答应只会亏空最该投入的事。今天推掉一场无效饭局，把时间还给了想做的项目——守住边界，才守得住真正想要的生活。以前总觉得拒绝别人不好意思，后来发现，那些因为你拒绝一次就翻脸的关系，本来也不值得维护。真正的朋友会尊重你的时间和选择。学会说不，不是变得冷漠，而是变得清醒。",
  "焦虑最凶的时候，我试过『五分钟法则』：只承诺做五分钟，不做就停。结果几乎没有一次真的停。大脑怕的是 forever，不怕 just now。把无限的压力切成有限的此刻，行动就不再是悬崖，而是下一脚踩稳的台阶。今天又靠它挪过了一座山。其实焦虑的本质，是把未来的不确定提前扛在现在，压垮你的不是事情本身，是你对它的想象。把注意力拉回当下这一步，你会发现此刻能做的远比以为的多。别想太远，先做五分钟，剩下的交给惯性。",
  "在这行待得越久，越信一句话：真正的安稳，是你自己心里有底。年轻时以为赚到手里才踏实，现在看，底，是那种『最坏情况来了，你和孩子、和爱人也不至于一下被拍垮』的确定性。我们拼命工作、拼命规划，图的不就是一家老小有个暖的地方。有些东西急不来：孩子学走路急不来，受伤的人重新站起来急不来，你自己的安稳也急不来。慢一点没关系，只要还在走，就比停着强。",
  "最近戒掉一个习惯：遇事先问『别人会怎么看』。换成『这件事的底层逻辑是什么』之后，决策快了一倍。多数内耗来自把别人的权重加太高。你不是活给观众看的，把评判权收回，行动的力气就回来了。今天又替自己省下两小时自我审判。回头看，那些让我纠结好几天的事，别人根本没注意到。真正的成熟，是慢慢学会不在别人的目光里找存在感，而是在自己的节奏里找确定感。你的时间很贵，别浪费在揣测上。",
  "开始记账之后，发现钱这东西，记着记着就看清了自己。省钱不等于抠门，是把有限的钱，花在真正在意的人身上、真正重要的事上。把『该省』和『该花』分清楚，是一种本事。很多人要么乱花要么死抠，其实中间那条线才是生活——该讲究的讲究，该将就的将就。人生说到底就是不停做取舍：哪些事值得花力气，哪些可以放下。把优先级排好，钱自然就听话了。清清楚楚，也暖暖和和。",
  "我不爱跟人说我读书，说出来总像在立人设，其实不是。就是晚上留十分钟给自己，翻两页，碰见一句戳心的，就停下来想半天。今天看到一句大概是说『人最贵的投资是提前安排』，没记书名，但这句话我认。能在喧嚣里给自己留一块安静的地方，是一种本事。我不指望谁觉得我多有文化，我只知道，那些书替我接住过很多想不通的晚上。一个普通中年人，也有自己的精神角落。挺好。",
  "35岁往后，身边很多人开始说『就这样吧』『定型了』。我不太信。人哪有什么定型，不过是懒得长而已。今天被客户拒了，搁以前会沮丧，现在想，拒绝也是反馈，告诉我哪没讲透。中年不是下坡路，是你知道时间贵了，所以更想把每件事做对。晚上回想，那些所谓『稳定』，从来不是不变，是愿意一直长。承认自己普通，但依然认真生活，这就够了。人生还长，咱都还在生长。",
  "做了十二年这行，最大的变化不是收入，是看人的眼光。以前看一个人看他穿什么开什么，现在看他有没有给未来留后路。我见过太多『等以后再说』的人，后来真的来不及了；也见过咬牙给家人配好保障的，眼里有光。所谓成熟，大概就是承认自己普通，但愿意为在意的人把平凡的一天过认真。人生没有标准答案，只有你愿意为谁、为什么，把今天过踏实。晚上遛弯时想，稳，不是不波动，是波动来了你兜得住。",
  "今天没什么惊天动地的事。早上按计划推进，中午好好吃了一顿，下午处理完手头的事，晚上留了点时间给自己。睡前回想，这些碎碎念拼起来，就是生活，挺完整的。我们总以为『值得发朋友圈』的得是大事，其实不是。是那杯温水，是窗外那阵风，是完成一件小事后的松快。人生大部分时候都是平淡的，但平淡里藏着最稳的幸福。所以这条不发产品、不发干货，就发一句：把平凡的一天过好，本身就是一种了不起。",
  "长期主义这件事，说多了像口号，做起来才知分量。每天多走两步、多读几页、多为将来存一点，当时看毫无波澜，半年一年后身体会谢你、脑子会谢你、未来的你会谢你。别指望一夜变样，复利从来不在短期显现。今天没做成什么大事，但把该做的都做了，这就算赢。渐渐明白，好的人生不是某个高光时刻，是无数个『不算差』的今天叠起来的。动起来，哪怕很慢，也是动。"
];

const LIVE = [
  "今天9点直播，不讲产品，讲养老的基础逻辑：年轻时的钱，怎么稳稳流到老。想搞懂自己老了有没有底的，来。",
  "9点直播预告：延迟退休之下，你的养老金到底够不够？我拿真实测算跟你算。不唬人，只算账。",
  "明天9点直播，主题：复利这个东西，为什么保险公司比你会用。基础逻辑类，听懂不吃亏。",
  "9点直播，专讲一个被忽略的真相——社保养老金，和你以为的可能不一样。基础逻辑，小白也能听。",

  "今天9点直播，聊个扎心的：你退休后第一个月，钱到底从哪来？基础逻辑我讲透，来算你自己的账。",

  "9点直播预告：很多人把顺序搞反了——先攒钱还是先配保障？我把底层顺序理给你。基础逻辑，不绕弯子。"
];

const NOON = [
  "今天中午做了番茄牛腩，99在旁边馋得直拍餐椅。230斤的我少盛了点，但汤喝了两碗。家常饭，最养人。",
  "中午一个人吃饭，给自己煮了碗面。董教练带99去康复了，家里突然安静。这种安静，也挺好。",
  "今天尝试少油版红烧肉，居然成功了。省钱期也能吃好，关键是不糊弄自己。",
  "中午董教练回来，说想吃我做的饺子。和面、调馅、99在旁边玩面团。一家三口（加四脚）的厨房，热闹但踏实。",
  "记账第N天，今天午饭成本12块，比外卖省30。省钱不等于吃差，自己做的，香。",
  "中午炖了排骨汤，四只狗围着我转。图图最精，知道我心软先给它的。家里这些毛孩子，比闹钟准时。",
  "今天中午简单，蒸蛋+青菜。230斤在控，但蛋白质得够。健康这事儿，从一顿饭开始较真。",
  "董教练做了康复餐给我，低卡但好吃。康复教练的厨艺，意外在线。中午这顿，是被爱投喂的一顿。",

  "今天中午把昨天的红烧肉热一热配米饭，230斤的我只盛小半碗。不浪费，也量力，挺好。",

  "中午董教练朋友送来自家种的番茄，我顺手炒了个蛋。当季的菜格外甜，日子就是这些小确幸。"
];

const HARD = [

// 时段配置（非整点提醒）
const SLOTS = [
  {key:"MORNING", label:"早晨感悟", time:"08:23", pool:MORNING, kw:"sunrise,morning,light", shot:"拍一张清晨窗边/第一缕光，或用下方配图"},
  {key:"LIVE",    label:"直播预告", time:"08:47", pool:LIVE,    kw:"microphone,live,stage", shot:"截一张直播间封面/你举着手机准备开播"},
  {key:"NOON",    label:"中午吃什么", time:"12:31", pool:NOON,  kw:"homecooking,food,warm", shot:"拍今天的午饭，热气腾腾那种"},
  {key:"HARD1",   label:"下午硬核①", time:"14:42", pool:HARD,   kw:"idea,lightbulb,think", shot:"拍一张纸笔算账的手/或你直播时的认真脸"},
  {key:"HARD2",   label:"下午硬核②", time:"16:37", pool:HARD,   kw:"chess,strategy,plan", shot:"拍你翻条款/做笔记的桌面"},
  {key:"NIGHT",   label:"晚间生活碎片", time:"22:48", pool:NIGHT,   kw:"family,home,cozy", shot:"拍一张家里的烟火气：厨房/娃/毛孩子，或睡前那盏灯"}
];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function dayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function pick(pool,seed){const rng=mulberry32(seed);return pool[Math.floor(rng()*pool.length)]}

// 状态
let sent = {};
function loadSent(){try{sent=JSON.parse(localStorage.getItem('pyq_sent_'+dayKey())||'{}')}catch(e){sent={}}}
function saveSent(){localStorage.setItem('pyq_sent_'+dayKey(),JSON.stringify(sent))}

function getIdea(){return localStorage.getItem('pyq_idea')||''}

function buildCards(){
  const dk = dayKey();
  const feed = document.getElementById('feed');
  feed.innerHTML='';
  SLOTS.forEach((s,idx)=>{
    let txt = pick(s.pool, dk*7 + idx*131 + (s.key==='HARD2'?97:0));
    if(s.key==='MORNING'){
      const idea=getIdea();
      if(idea.trim()) txt = '今天复盘时想到：'+idea.trim()+'\n\n'+txt;
    }
    const seed = dk + idx*17;
    const img = 'https://loremflickr.com/600/400/'+s.kw+'?lock='+seed;
    const isSent = sent[s.key];
    const el=document.createElement('div');
    el.className='post'; el.id='post-'+s.key;
    el.innerHTML =
      '<div class="slot"><span class="tag">'+s.label+' · '+s.time+'</span>'+
        '<span class="st '+(isSent?'sent':'')+'" id="st-'+s.key+'">'+(isSent?'已发 ✓':'待发')+'</span></div>'+
      '<img src="'+img+'" alt="" onerror="this.style.display=\'none\'">'+
      '<div class="txt">'+txt+'</div>'+
      '<div class="shot">📷 '+s.shot+'</div>'+
      '<div class="acts">'+
        '<button class="copy" id="cp-'+s.key+'" onclick="copyPost(\''+s.key+'\')">复制文案</button>'+
        '<button class="sent-btn '+(isSent?'on':'')+'" id="sb-'+s.key+'" onclick="markSent(\''+s.key+'\')">'+(isSent?'取消已发':'标记已发')+'</button>'+
      '</div>';
    feed.appendChild(el);
  });
}

function copyPost(key){
  const el=document.querySelector('#post-'+key+' .txt');
  const txt=el.textContent;
  navigator.clipboard.writeText(txt).then(ok).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);ok();
  });
  function ok(){const b=document.getElementById('cp-'+key);b.textContent='已复制 ✓';b.classList.add('ok');
    setTimeout(()=>{b.textContent='复制文案';b.classList.remove('ok')},1500)}
}
function markSent(key){
  sent[key]=!sent[key]; saveSent();
  const st=document.getElementById('st-'+key), sb=document.getElementById('sb-'+key);
  st.textContent=sent[key]?'已发 ✓':'待发'; st.classList.toggle('sent',sent[key]);
  sb.classList.toggle('on',sent[key]); sb.textContent=sent[key]?'取消已发':'标记已发';
  renderTimeline();
}

function renderTimeline(){
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  const tl=document.getElementById('timeline'); tl.innerHTML='';
  SLOTS.forEach(s=>{
    const [h,m]=s.time.split(':').map(Number);
    const t=h*60+m;
    const done=sent[s.key];
    const isNow=!done && cur>=t-2 && cur<=t+30;
    const cls='tl-item'+(done?' done':'')+(isNow?' now':'');
    const item=document.createElement('div');
    item.className=cls;
    item.innerHTML='<span class="tl-dot"></span><span class="tl-time">'+s.time+'</span>'+
      '<span class="tl-label">'+(done?'✓ ':'')+s.label+'</span>';
    tl.appendChild(item);
  });
}

// ===== 提醒系统 =====
let remindOn=false, reminded={}, timer=null, audioCtx=null;
function toggleRemind(){
  if(!remindOn){
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().then(p=>{ if(p!=='granted') toast('已开启页面内提醒（系统通知未授权）'); });
    }
    remindOn=true; document.getElementById('remindBtn').textContent='提醒已开';
    document.getElementById('remindBtn').classList.add('on');
    document.getElementById('remindHint').textContent='到点会弹提醒+响铃，保持本页打开';
    toast('提醒已开启 · 保持本页打开即可');
    tick(); timer=setInterval(tick,20000);
  }else{
    remindOn=false; clearInterval(timer);
    document.getElementById('remindBtn').textContent='开启提醒';
    document.getElementById('remindBtn').classList.remove('on');
    document.getElementById('remindHint').textContent='非整点温柔提醒，打开页面才生效';
  }
}
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(0.001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,audioCtx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.5);
    o.start();o.stop(audioCtx.currentTime+0.5);
  }catch(e){}
}
function tick(){
  if(!remindOn) return;
  const now=new Date(); const cur=now.getHours()*60+now.getMinutes();
  SLOTS.forEach(s=>{
    const [h,m]=s.time.split(':').map(Number); const t=h*60+m;
    const key=dayKey()+s.key;
    if(!sent[s.key] && !reminded[key] && cur>=t && cur<=t+3){
      reminded[key]=true;
      beep();
      const post=document.getElementById('post-'+s.key);
      if(post){post.classList.remove('flash');void post.offsetWidth;post.classList.add('flash');
        post.scrollIntoView({behavior:'smooth',block:'center'});}
      if('Notification' in window && Notification.permission==='granted'){
        new Notification('该发朋友圈啦 · '+s.label, {body:s.time+' 该发：'+s.label});
      }
      toast('⏰ '+s.time+' 该发：'+s.label);
    }
  });
  renderTimeline();
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// 想法保存
function saveIdea(){
  const v=document.getElementById('ideaInput').value;
  localStorage.setItem('pyq_idea',v);
  document.getElementById('ideaHint').textContent=v.trim()?'已保存 ✓ 明天早晨感悟会用上':'本地保存，仅此设备';
  toast('想法已保存');
}

function init(){
  const d=new Date(); const wk=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
  document.getElementById('ideaInput').value=getIdea();
  loadSent(); buildCards(); renderTimeline();
  setInterval(renderTimeline,60000);
}
init();
</script>
