function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

let salt = 0;
function todayKey(){
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function pick(seed){
  const rng = mulberry32(seed);
  const arr = POSTS.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr.slice(0,5);
}
function render(list){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  list.forEach((p,idx)=>{
    const el = document.createElement('div');
    el.className = 'post';
    el.innerHTML =
      '<span class="tag">'+p.tag+'</span>'+
      '<div class="txt">'+p.t+'</div>'+
      '<div class="shot">📷 '+p.shot+'</div>'+
      '<div class="acts"><button class="copy" onclick="copyPost(this,'+idx+')">复制文案</button></div>';
    feed.appendChild(el);
  });
}
function copyPost(btn,idx){
  const txt = POSTS.find(p=>p.t===document.querySelectorAll('.post .txt')[idx].textContent).t;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='已复制 ✓'; btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='复制文案'; btn.classList.remove('ok');},1500);
  }).catch(()=>{
    // 兜底
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);
    btn.textContent='已复制 ✓'; btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='复制文案'; btn.classList.remove('ok');},1500);
  });
}
function swap(){
  salt++;
  render(pick(todayKey() + salt*7919));
}
function init(){
  const d = new Date();
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('date').textContent =
    (d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
  render(pick(todayKey()));
}
init();
</script>
