<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>孟卉工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#e8523a;--a:#d63031;--g:#f0932b;--bg:#fff5f2;--card:#fff;--t:#2c2c2c;--tl:#999;--bd:#fce4dc;--sb:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--t);-webkit-tap-highlight-color:transparent;padding-bottom:calc(64px + var(--sb));-webkit-font-smoothing:antialiased}

/* Header */
.hd{background:var(--p);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;z-index:50}
.hd-r{display:flex;justify-content:space-between;align-items:center}
.hd-t{font-size:17px;font-weight:700}
.hd-s{font-size:11px;opacity:.8;margin-top:2px}
.hd-d{font-size:12px;opacity:.85;text-align:right;line-height:1.5}

/* Stats */
.st{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.st::-webkit-scrollbar{display:none}
.st-i{flex-shrink:0;background:var(--card);border-radius:10px;padding:8px 12px;min-width:64px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.st-v{font-size:20px;font-weight:700}
.st-l{font-size:10px;color:var(--tl);margin-top:1px}

/* Progress */
.pg{padding:0 16px 8px}
.pg-r{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pg-l{font-size:11px;width:62px;flex-shrink:0;color:var(--tl)}
.pg-b{flex:1;height:5px;background:#e0d8cc;border-radius:3px;overflow:hidden}
.pg-f{height:100%;border-radius:3px;transition:width .3s}
.pg-n{font-size:11px;color:var(--tl);width:34px;text-align:right}

/* Chips */
.ch{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ch::-webkit-scrollbar{display:none}
.ch-i{flex-shrink:0;padding:5px 12px;border-radius:14px;font-size:12px;background:var(--card);border:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none;transition:all .12s}
.ch-i.on{background:var(--p);color:#fff;border-color:var(--p)}

/* Search */
.sr{padding:0 16px 8px}
.sr input{width:100%;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);font-size:14px;outline:none;background:var(--card)}
.sr input:focus{border-color:var(--p)}

/* List */
.ls{padding:0 16px}
.it{background:var(--card);border-radius:12px;padding:12px;margin-bottom:7px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer;position:relative;transition:transform .1s}
.it:active{transform:scale(.98)}
.it-t{display:flex;align-items:flex-start;gap:10px}
.ck{width:22px;height:22px;border-radius:50%;flex-shrink:0;margin-top:1px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ck.d{background:var(--p);border-color:var(--p)}
.ck.d:after{content:'✓';color:#fff;font-size:12px}
.it-i{flex:1;min-width:0}
.it-tt{font-size:14px;font-weight:600;line-height:1.35}
.it-hk{font-size:12px;color:var(--tl);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-m{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.bg{display:inline-block;padding:1px 7px;border-radius:7px;font-size:10px;font-weight:600}
.bs{background:#e3f2fd;color:#1565c0}
.bl{background:#fce4ec;color:#c62828}
.bd{background:#e8f5e9;color:#2e7d32}
.bp{background:#fff3e0;color:#e65100}
.mt{font-size:10px;color:var(--tl)}
.it-a{position:absolute;right:10px;top:10px;display:flex;gap:3px}
.ab{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Modal */
.mm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-end}
.mm.s{display:flex}
.mb{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:18px 16px;padding-bottom:calc(18px + var(--sb));-webkit-overflow-scrolling:touch}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.mt2{font-size:17px;font-weight:700;flex:1;padding-right:10px;line-height:1.4}
.mc{background:none;border:none;font-size:24px;cursor:pointer;color:#999;padding:0 4px;flex-shrink:0}
.mbd{background:#f9f7f4;border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.75;max-height:45vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ma{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.bn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .12s}
.bp2{background:var(--p);color:#fff}
.bo2{background:#fff;border:2px solid var(--p);color:var(--p)}
.bs2{padding:6px 12px;font-size:12px}

/* Nav */
.nv{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--bd);z-index:50;padding-bottom:var(--sb)}
.ni{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-size:10px;color:var(--tl);transition:color .12s}
.ni .ni-i{font-size:18px;display:block;margin-bottom:1px}
.ni.on{color:var(--p);font-weight:600}

/* Empty */
.em2{text-align:center;padding:36px 20px;color:var(--tl)}
.em2 .ei{font-size:36px;margin-bottom:6px}

/* Toast */
.ts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
.ts.s{opacity:1}

/* Count */
.ct{font-size:11px;color:var(--tl);padding:0 16px 5px}
</style>
</head>

<script>

var SCRIPTS = [
{"id":"t1","title":"银行利率跌破1%！你的存款正在偷偷缩水","type":"short","category":"热点追踪","duration":"65s","hook":"2026年8月，一年期存款利率跌破1%，只有0.95%。存10万块，一年利息不到1000块！","tags":["银行利率","存款缩水","热点","养老规划"],"script":"【开头-钩子】\n2026年8月，银行存款利率再创新低。\n一年期定存只有0.95%，三年期1.25%，五年期也就1.55%。\n存10万块在银行，一年利息不到1000块钱。一千块，连一顿像样的年夜饭都吃不了。\n你辛苦挣的钱，放在银行里正在悄悄缩水。\n\n【痛点/数据展开】\n这不是危言耸听。咱们算一笔真实的账。\n假设你现在有100万存款，存三年期定期，利率1.25%，一年利息12500块。\n看起来还行对吧？但通货膨胀呢？\n2025年全国CPI涨幅大概2%左右，实际购买力在下降。你的100万，实际购买力每年都在打折扣。\n更扎心的是，这利率还在降。去年三年期还有1.95%，今年只剩1.25%了。照这个趋势，明年可能跌破1%。\n到那时候，你存银行不光赚不到钱，还得倒贴通胀的损失。\n这就叫负利率时代的温水煮青蛙——你看着数字没变少，但钱越来越不值钱。\n\n【解决方案/核心观点】\n那怎么办？三个出路：\n第一，不要把全部身家都放在银行存款。保持3-6个月生活费做活期就够了，剩下的钱得动起来。\n第二，在利率继续下跌之前，锁定当下的利率。养老年金、增额终身寿险这类产品，能把现在的利率水平写进合同，锁定一辈子。\n第三，拉长投资周期。短期来看利率确实很低，但如果你有10年、20年的规划眼光，复利的效果会让你大吃一惊。\n\n【金句收尾】\n利率下行时代，会存钱的人和会锁利的人，差距会越来越大。\n你的钱不是在帮你赚钱，就是在帮别人赚钱——就看你怎么选。\n\n【行动号召】\n想知道你现在存的钱怎么配置最合理？评论区留下你的存款金额，我帮你算一笔账。\n关注孟卉，带你看懂养老和钱的事。","status":"todo","inToday":true},
{"id":"t2","title":"养老金22连涨，为什么你还不能只靠社保？","type":"short","category":"政策解读","duration":"70s","hook":"养老金22连涨听着很美，但涨幅只有2%左右。算完真实替代率，你可能笑不出来。","tags":["养老金调整","政策解读","社保","替代率"],"script":"【开头-钩子】\n养老金22连涨了，新闻标题一片喜庆。\n但我劝你冷静一下——涨幅只有2%左右，而且低收入群体涨得多，高收入群体涨得少。\n这是好事吗？对退休人员来说是。但对你呢？\n\n【痛点/数据展开】\n先看数据。2026年养老金调整方案明确：总体涨幅约2%，定额调整向低收入群体倾斜。\n这意味着什么？如果你退休前工资高、社保基数高，你的涨幅可能连2%都不到。\n再看替代率。中国目前养老金平均替代率只有40%-45%，已经低于国际警戒线55%。\n退休前月入1万，退休后社保给你4000-4500块。\n而这个替代率还在逐年下降——老龄化加剧、少子化持续，交钱的人越来越少，领钱的人越来越多。\n到2050年，平均替代率可能跌到30%以下。\n换句话说，你现在月入1万，退休后社保可能只给3000块。够吗？你自己品。\n\n【解决方案/核心观点】\n社保养老金是基础，但它只能保底，不能保品质。\n养老三支柱模型：第一支柱社保（解决温饱）、第二支柱企业年金（大部分人没有）、第三支柱个人商业养老金（你自己的事）。\n别指望国家能让你退休后还过得体面——体面是靠自己提前规划出来的。\n每年12000的个人养老金账户额度，能用的先用上。\n商业养老年金，能买的趁早买。利率下行时代，晚一年买，同样的钱领得就少一分。\n\n【金句收尾】\n社保是国家给你的底线，商业养老金是你给自己的上限。\n底裤能遮羞，但想过得体面，你得自己添衣服。\n\n【行动号召】\n想知道你退休后社保能领多少钱？评论区：当前月收入+所在城市，我帮你算。","status":"todo","inToday":true},
{"id":"t3","title":"延迟退休最新时间表：你的退休年龄是多少？","type":"short","category":"算账型","duration":"68s","hook":"延迟退休真的来了！2026是关键年。我帮你对号入座，算清楚你的退休年龄到底延到什么时候。","tags":["延迟退休","缴费年限","政策","算账"],"script":"【开头-钩子】\n2026年，延迟退休的关键年。\n很多人到现在还不知道自己到底什么时候能退休。今天帮你对号入座。\n\n【痛点/数据展开】\n根据已公布的时间表：\n第一，退休年龄从2025年开始逐步延迟，男性从60岁延迟到63岁，女性职工从50岁延迟到55岁，女性干部从55岁延迟到58岁。\n每年延迟3个月，到2029年基本到位。\n第二，更关键的是缴费年限变化——从2030年开始，领取养老金的最低缴费年限从15年逐步提高到20年。\n每年提高6个月，到2035年全面实施。\n这意味着什么？如果你现在35岁，到退休年龄刚好交满20年没问题。但如果你现在45岁，之前断断续续只交了10年——你就得补，还得补够20年。\n还有一批人更惨：80后、90后。等你退休的时候，不仅年龄延后了，缴费年限也拉长了。两头挤压。\n\n【解决方案/核心观点】\n面对延迟退休，你能做什么？\n第一，核对你的社保缴费记录。打开国家社保公共服务平台或支付宝市民中心，查你交了几年、基数多少。\n第二，算你的退休年龄。男性用63减你出生年份，女性职工用55减、女干部用58减，再查你是哪一年开始延迟的。\n第三，如果不想等到63岁退休——靠你自己。攒够养老钱，你就有底气提前退。社保是规定你什么时候能领钱，不是规定你什么时候能不干活。\n\n【金句收尾】\n延迟退休是国家缺钱，提前退休是你有钱。\n别把退休的自由交给政策，攥在自己手里。\n\n【行动号召】\n评论区：你的出生年份+性别，我帮你算你的精确退休年龄。","status":"todo","inToday":true},
{"id":"t4","title":"月入8000/15000/30000，分别怎么规划养老？","type":"short","category":"方案型","duration":"72s","hook":"收入不同，养老策略完全不同。月入8000和月入30000的人，养老方案差了不止三个档次。","tags":["养老规划","分层策略","方案","收入"],"script":"【开头-钩子】\n月入8000、15000、30000的人，养老该怎么规划？\n这个问题我被问了不下500遍。今天一次性说清楚。\n\n【痛点/数据展开】\n先说月入8000：这是大多数二三线城市普通白领的收入。\n你的核心策略是社保打底加小额商业补充。\n每月必须交社保，按实际基数交，别贪图到手多几百块按最低基数。那几百块换的是退休后每月少两三千。\n每月再挤出500-800块买一份养老年金或增额寿，坚持20年。60岁后，社保能领2500-3000，商业补充能领1000-1500，合计4000左右。加上自己的积蓄，基本生活没问题。\n\n再说月入15000：这是中层收入，有一定规划空间。\n社保正常交，另外每年投入2-3万进商业养老金体系。建议配一份年金险（锁定终身现金流）加一份增额寿（灵活取用）。再别忘了每年12000的个人养老金账户额度，享受税收优惠。\n60岁后，社保约4000，年金约2000，增额寿灵活补充，合计每月6000-7000的现金流。\n\n最后月入30000：高收入群体的养老策略是全面布局。\n社保全额缴纳（基数高将来领得多），个人养老金账户存满12000，商业养老年金每年投5-8万。还可以考虑分红型年金、养老社区资格等高端配置。\n60岁后，社保5000+年金4000+增额寿灵活取用+其他投资，月现金流1万以上。而且因为有养老社区资格，居住和护理也提前锁定了。\n\n【金句收尾】\n养老不是看你挣多少，是看你能留住多少。\n现在每月少花1000块存养老，比退休后每月缺1000块到处借，强一万倍。\n\n【行动号召】\n你月入多少？评论区告诉我，我帮你出专属方案。","status":"todo","inToday":true},
{"id":"t5","title":"增额寿的现价表怎么看？3分钟教你避坑","type":"short","category":"避坑指南","duration":"75s","hook":"增额寿的现金价值表你会看吗？销售给你看的那一列，可能是最不重要的。今天3分钟教你学会看现价表，避开90%的坑。","tags":["增额寿","现金价值","避坑指南","现价表"],"script":"【开头-钩子】\n增额终身寿险的现金价值表，你认真看过吗？\n销售给你看的时候，手指一定指着中间那一列——每年能取多少钱。\n但今天我要告诉你，那一列可能是最不重要的。\n\n【痛点/数据展开】\n一份增额寿的现价表有三列最核心：\n第一列：保单年度。这是你交了第几年。\n第二列：累计保费。你一共交了多少钱。\n第三列：现金价值。当年退保能拿回多少钱。\n\n第一个坑：回本时间。\n很多人不知道，增额寿前几年退保是亏的。交了5万，第一年现价可能只有2万多。你要看到第几年现价超过累计保费——这才是真正的回本点。\n一般5年交的产品，第5-7年回本。10年交的，第9-11年回本。超过这个时间还没回本的，产品有问题。\n\n第二个坑：IRR内部收益率。\n销售说收益率3.0%、3.5%——你看现价表自己算过吗？用IRR公式，把每年的现金流输入进去，看真正的年化收益是多少。很多产品号称3.5%，实际算下来2.8%都不到。\n\n第三个坑：减保规则。\n现价表上的数字，你不一定全能取出来。有的产品每年最多减保20%，有的限制次数，有的规定取到一定金额就不能再取。这些规则不在现价表上，在合同条款里。\n\n【解决方案/核心观点】\n怎么正确看现价表？记住三句话：\n一、先看回本时间，再看IRR。回本慢的直接pass，别浪费时间。\n二、用Excel或年金计算器算真实IRR，别听销售说的预期收益。\n三、翻合同条款里的减保规则，确认取钱的自由度。\n\n【金句收尾】\n买增额寿不看现价表，就像买房不看户型图。\n销售说的话可以好听，但现价表上的数字不会说谎。\n\n【行动号召】\n你手里有增额寿合同吗？评论区扣增额寿，我教你怎么看懂你的现价表。","status":"todo","inToday":true},
{"id":"t6","title":"灵活就业交社保，选哪个档次最划算？","type":"short","category":"算账型","duration":"70s","hook":"灵活就业交社保，60%档还是100%档？我算了一笔账，结果和你想的可能不一样。","tags":["灵活就业","社保","档次","算账"],"script":"【开头-钩子】\n做自媒体、跑网约车、开店、自由职业——灵活就业的朋友，社保到底按哪个档次交最划算？\n今天我把60%、100%、300%三个档次全部算一遍，结论可能会让你意外。\n\n【痛点/数据展开】\n以某省会城市为例，2026年社保缴费基数下限4000元，上限20000元。\n灵活就业人员养老保险缴费比例20%，全部自己承担。\n\n按60%档（基数4000）：每月交800元，15年共交14.4万。退休后每月领约1600-2000元。回本周期约6-7年。\n按100%档（基数6700）：每月交1340元，15年共交24.1万。退休后每月领约2400-3000元。回本周期约7-8年。\n按300%档（基数20000）：每月交4000元，15年共交72万。退休后每月领约5000-6000元。回本周期约10-12年。\n\n从纯回本角度看，60%档最快。但你仔细看——100%档比60%档每月多交540块，退休后每月多领800-1000块。这540块的投资回报，比你在任何理财产品里能找到的都高。\n\n【解决方案/核心观点】\n所以我的建议是：\n预算紧张、收入不稳定：选60%档，先保证不断缴。\n收入稳定、30-45岁：选100%档，性价比最高。多交的钱换来的是退休后实实在在的现金流。\n收入高、临近退休：可以选200%-300%档拉高最后几年的缴费基数，提升养老金计算。\n还有一点很多人不知道：缴费档次每年可以调整一次。收入好的年份选高档次，差的时候选低档，灵活搭配。\n\n【金句收尾】\n社保缴费不是消费，是投资。而且是你能买到的最安全的投资。\n别因为心疼每个月那几百块，丢了退休后每个月几千块的保障。\n\n【行动号召】\n评论区：你的城市+月收入，我帮你算最佳缴费档次。","status":"todo","inToday":true},
{"id":"t7","title":"给30岁年轻人的养老建议：现在开始存500块够吗？","type":"short","category":"情感共鸣","duration":"68s","hook":"30岁的你，现在开始每月存500块养老，够吗？我用复利算了一下，答案让人又惊喜又心酸。","tags":["年轻人养老","情感","复利","30岁"],"script":"【开头-钩子】\n前两天一个30岁的粉丝私信我：孟卉姐，我现在每月只能存500块养老，是不是太少了？要不要等收入高了再开始？\n我的回答是：500块不多，但你现在开始存，比以后每月存2000都强。\n\n【痛点/数据展开】\n咱们用复利算一笔账。假设你30岁，每月存500块买一份养老年金，按保守3%复利计算，存30年。\n到60岁，你的账户里大概有28万左右。\n60岁开始领，每月能领大概1500-1800块，活多久领多久。\n到85岁，总共能领45-50万。\n\n这就是每月500块的力量。它不是让你暴富，是让你老了以后有底气说：我有自己的钱。\n\n反过来，如果你等到40岁才开始存，同样每月存1000块，存20年。\n到60岁，账户大概26万。每月领1400-1600。\n存的钱多了，但时间短了，结果反而不如30岁开始每月存500。\n这就是复利最残忍也最公平的地方——它只奖励耐心的人。\n\n【解决方案/核心观点】\n30岁，正是养老规划的黄金起点。\n你现在有三件事可以做：\n第一，社保不能断。不管你做什么工作，灵活就业也好，全职也好，社保养老要交上。\n第二，每月存500-1000进一个专属养老账户。可以是个人养老金账户，也可以是商业年金。关键是这钱雷打不动，每月自动扣，别给自己后悔的机会。\n第三，不要因为钱少就不开始。500块比0块好一万倍。养老是马拉松，起跑的时候不怕慢，就怕不跑。\n\n【金句收尾】\n30岁的你，未来还有30年以上的工作时间。\n每月500块，是对60岁的自己说的一句话：我年轻的时候，没有忘记你。\n\n【行动号召】\n你今年多大？每月能存多少？评论区聊聊，我帮你看看你的起点够不够。","status":"todo","inToday":true},
{"id":"t8","title":"养老年金 vs 增额寿 vs 存款，养老到底选谁？","type":"short","category":"对比","duration":"72s","hook":"养老年金、增额寿、银行存款，三个工具三种思路。选错了，你老了以后可能后悔20年。","tags":["年金vs增额寿","对比","存款","养老工具"],"script":"【开头-钩子】\n养老到底该用什么工具？养老年金、增额终身寿险、银行存款，三个选项摆在面前，很多人选错了。\n今天我用最简单的话，帮你理清楚到底该选谁。\n\n【痛点/数据展开】\n先说银行存款：最灵活，但最不值。\n利率已经跌破1%，100万存一年利息不到1万块。而且你老了以后，看着账户余额一天天减少，那种焦虑感比没钱还难受。\n存款适合放3-6个月的生活费应急，不适合做养老主力。\n\n再说增额终身寿险：灵活加增值，但不保证终身。\n它的特点是像一个会长大的存钱罐，钱在里面复利增长，你想用的时候可以取。\n但缺点是——取完就没了。如果你活到90岁，钱在80岁就取光了，后面10年怎么办？\n增额寿适合做养老的灵活补充，不适合做唯一依靠。\n\n最后说养老年金：不灵活但最确定。\n它的逻辑很简单——你现在存一笔钱，到约定年龄开始，每月准时到账，活多久领多久。\n这笔钱雷打不动，不会因为市场波动少一分，也不会因为你活得太长寿而花完。\n缺点是取钱不灵活，急用钱的时候不能一把全拿出来。\n\n【解决方案/核心观点】\n所以最佳策略不是三选一，而是三合一：\n第一层：银行存款——3-6个月生活费应急。\n第二层：增额终身寿险——灵活取用的资金池，应对大额支出。\n第三层：养老年金——终身现金流，保证每月有饭吃。\n比例怎么分？我的建议是养老金的50%放年金（保底线）、30%放增额寿（灵活池）、20%留存款（应急金）。\n\n【金句收尾】\n养老不是一道选择题，是一道组合题。\n银行存款给你安全感，增额寿给你灵活度，养老年金给你确定性。三个都有，才叫真正的体面养老。\n\n【行动号召】\n你现在用了哪几个工具？评论区聊聊你的养老配置，我帮你看看还缺什么。","status":"todo","inToday":true},
{"id":"t9","title":"养老院一个月8000块，普通人住得起吗？","type":"short","category":"数据冲击","duration":"70s","hook":"你知道现在好一点的养老院一个月多少钱吗？我调研了三个城市的养老院价格，结果让我这个做养老规划的都有点慌。","tags":["养老院","养老成本","数据","护理"],"script":"【开头-钩子】\n前两天我去参观了一家养老社区，环境是真的好——独立卫浴、24小时管家、康复理疗、老年大学全都有。\n但看到价格表的那一刻，我心里咯噔了一下。一个月8000块，而且只是中档水平。\n普通人真的住得起吗？\n\n【痛点/数据展开】\n我调研了三个城市的养老机构价格：\n一线城市（北京/上海）：公办养老院排号3-5年，费用3000-5000/月。民办中高端养老社区，8000-15000/月。高端护理型，20000+/月。\n二线城市（成都/武汉）：公办1500-3000/月。民办中端5000-8000/月。高端社区8000-12000/月。\n三四线城市：公办800-1500/月。民办2000-4000/月。高端护理机构5000-8000/月。\n\n这些费用包括住宿、餐饮、基本护理。但不包括医疗费用。如果老人需要专业护理——比如失能、半失能——费用直接翻倍。\n请一个住家护工，一线城市每月6000-8000起步，二三线也要4000-6000。\n\n现在回到现实：你退休后社保养老金每月3000-5000块，够住养老院吗？\n\n【解决方案/核心观点】\n养老院的费用不是到老了才需要准备的，是你现在就要开始规划的目标。\n如果你计划70岁以后住养老院，按现在价格每月6000算，20年就是144万。算上通胀，实际需要200万以上。\n这200万从哪来？三个来源：社保养老金（覆盖一半）、商业养老金（覆盖另一半）、子女支持（锦上添花）。\n\n【金句收尾】\n养儿防老不如养钱防老。\n你存的不是钱，是老了以后选择住什么档次养老院的资格。\n\n【行动号召】\n你想过住养老院吗？评论区：你所在城市+你对养老院的预算，我帮你算需要准备多少。","status":"todo","inToday":true},
{"id":"t10","title":"我是怎么给自己规划养老的——一个保险经纪人的自白","type":"short","category":"情感共鸣","duration":"75s","hook":"你们总问我怎么给别人规划养老，今天我说说我自己。一个卖保险的人，给自己买了什么。","tags":["保险经纪人","自白","养老规划","真实案例"],"script":"【开头-钩子】\n做了这么多年养老规划，你们最常问的一个问题是：孟卉，你自己买了什么？\n好，今天不藏着掖着，我把自己扒开了给你们看。\n\n【痛点/数据展开】\n我先说我怕什么。我怕三件事：\n第一，我怕老了一个人。不是孤独，是没钱。没钱的时候，身边的人都会变得很贵。\n第二，我怕生病拖累别人。我见过太多老人，一场大病掏空一家三代。我不想成为任何人的负担。\n第三，我怕活得太久。这不是矫情——活得久是福气，但钱花完了还活着，就是折磨。\n\n所以我给自己的规划是三层防护：\n第一层，社保。我以灵活就业身份按100%档交社保养老，每月1300多。这是地基，不能没有。\n第二层，商业养老年金。我买了两份。一份从35岁开始交，每年交5万，交10年，60岁开始每月领4000左右。另一份趸交了一份小的，65岁开始领，每月1500。两份加起来，60岁以后我每月有5500的固定现金流，活多久领多久。\n第三层，增额终身寿险。我配了一份作为灵活资金池。万一生大病、需要护理、或者想出去旅游，这笔钱可以随时取。\n\n三层加起来，60岁以后我每月固定收入至少5500，加上增额寿的灵活补充，加上社保的底，一个月能到8000左右。\n不多，但我很安心。因为每一分都是写进合同的，雷打不动。\n\n【解决方案/核心观点】\n我给自己做规划的时候，遵循一个原则：先保底线，再求上限。\n底线是——不管发生什么，我每个月有固定收入，够吃饭、够基本生活。\n上限是——如果身体好、运气好，我还能旅游、能给孙辈包红包、能体面地老去。\n养老规划不是让你暴富，是让你老了以后不需要求任何人。\n\n【金句收尾】\n我不相信任何人能给我安全感，我只相信写进合同的数字。\n这些数字，是我对60岁的孟卉说的一句话：别怕，年轻时的你已经为你准备好了。\n\n【行动号召】\n你也给自己做过养老规划吗？评论区聊聊你的想法。想让我帮你做一份专属方案的，直接私信我。","status":"todo","inToday":true},
{"id":"t11","title":"2026年中国养老全景：利率下行+养老金连涨+延迟退休，普通人如何破局？","type":"long","category":"深度解析","duration":"9min","hook":"利率跌破1%，养老金只涨2%，延迟退休又来了——2026年，普通人的养老困局怎么破？这期我用了整整一周时间整理数据，把中国养老的真实现状和破局之道，一次性讲透。","tags":["养老全景","利率下行","养老金","延迟退休","深度解析"],"script":"【开场 0:00-1:00】\n大家好，我是孟卉。\n今天这期内容，我准备了很久。2026年是中国养老的一个关键转折点，三件事同时发生了：\n第一，银行存款利率跌破1%，一年期定存只有0.95%，三年期1.25%，钱存银行正在慢性缩水。\n第二，养老金22连涨，但涨幅只有2%左右，养老金替代率持续走低。\n第三，延迟退休方案逐步落地，缴费年限从15年提高到20年，退休年龄逐年延后。\n\n这三件事叠加在一起，意味着什么？意味着靠存款养老越来越难、靠社保养老越来越紧、靠国家养老越来越远。\n那么普通人怎么办？今天这期，我从四个维度帮你梳理清楚——看清全局、算清缺口、选对工具、做好规划。\n\n【第一章：利率下行——你的钱正在被偷走 1:00-3:00】\n先看第一个趋势：利率持续下行。这不是短期波动，是长期趋势。\n从2020年到2026年，一年期定存利率从1.5%降到了0.95%，三年期从2.75%降到了1.25%。\n为什么降？因为经济增速放缓、人口老龄化、全社会投资回报率下降。利率是经济的体温计，经济越冷利率越低。\n日本就是前车之鉴。日本从1990年代开始进入低利率时代，一直持续了30多年，至今存款利率还在0%左右。中国正在走类似的路。\n\n对普通人意味着什么？假设你今年40岁，手上有100万存款。按现在1.25%利率存20年，到60岁本息合计大概128万。但20年通胀下来，128万的实际购买力大概只相当于现在的70-80万。\n也就是说，你把钱存银行20年，实际购买力缩水了20-30%。这不是存钱，是慢性失血。\n\n怎么办？唯一的办法是锁利。在利率继续下跌之前，用长期金融工具把当下的利率水平锁定。养老年金、增额终身寿险，就是专门用来做这件事的。它们能把3%左右的复利写进合同，不受市场利率影响。\n\n【第二章：养老金22连涨——涨了为什么还焦虑？3:00-5:00】\n第二个趋势：养老金年年涨，但大家越来越焦虑。矛盾在哪？\n养老金22连涨是事实，但涨幅从2016年的6.5%一路降到2026年的2%左右，也是事实。\n更关键的是替代率——养老金占退休前收入的比例。2000年替代率大概70%，2026年只有40%-45%，到2050年可能跌破30%。\n\n为什么？人口结构决定的。2026年中国60岁以上人口已经超过3亿，占总人口21%以上。而交社保的劳动年龄人口在减少。\n这就好比一个水池——进水口越来越小，出水口越来越大，水位只能越来越低。\n所以养老金连涨不是因为你缴得多、收益高，是因为国家在努力维持——但维持的能力是有限的。\n\n对你的启示：别把晚年生活品质寄托在社保涨幅上。社保是底线，不是上限。你自己存的商业养老金，才是决定你老了以后吃食堂还是下馆子的关键。\n\n【第三章：延迟退休——你不只要多干几年，还要多交几年钱 5:00-7:00】\n第三个趋势：延迟退休。2026年是关键年，退休年龄从60岁逐步延到63岁（男性），缴费年限从15年逐步提到20年。\n这背后有两层含义。\n第一层：你得多工作几年。1965年后出生的男性、1970年后出生的女性干部、1975年后出生的女性职工，都会受到影响。\n第二层：你得多交几年社保。以前交满15年就能领，以后得交满20年。如果中间断缴过，还得想办法补。\n\n最受冲击的是谁？两类人：\n一是灵活就业人员。本来收入就不稳定，社保全靠自己交，现在年限拉长，负担更重。\n二是临近退休但缴费年限不足的人。比如50岁才交了12年，以前再熬3年就够了，现在得熬10年。\n\n怎么应对？\n第一，别断缴。社保养老是最基础的保障，无论多难都要连续交。灵活就业按最低档也要交。\n第二，不要把退休的希望全押在社保上。延迟退休是国家层面的制度调整，你改变不了，但你可以改变自己的准备程度。\n第三，建立自己的退休时间表。如果你攒够了养老钱，你可以选择提前不工作——社保只是规定你什么时候能领钱，不是规定你什么时候才能不干活。\n\n【第四章：破局之道——普通人怎么给自己的养老兜底 7:00-8:30】\n说了这么多问题，到底怎么破局？四个步骤，适合大多数普通人。\n\n第一步：社保打底。不管你在哪工作，社保养老必须交。这是你能买到的最划算的养老保障，没有之一。\n第二步：个人养老金账户。每年12000额度，享受税收优惠，能省几百到几千块税。这笔钱可以买基金、存款、保险等养老产品。\n第三步：商业养老年金。根据自己的预算，配置一份终身年金险。原则是：交得起、不后悔、不断供。哪怕每月500块，也比不买强。\n第四步：增额终身寿险做灵活补充。应对大病、护理、旅游等大额支出，保持资金的灵活性。\n\n这四步就像盖房子：社保是地基，个人养老金是墙体，年金险是屋顶，增额寿是装修。缺一个，房子都不完整。\n\n【结尾 8:30-9:00】\n最后说一句掏心窝的话。\n我做养老规划这么多年，最大的感受是：大多数人不是没钱养老，是没想过养老需要多少钱。\n利率下行、养老金涨幅缩小、延迟退休——这些都不是我们能改变的。\n但我们能改变的是：从现在开始，为自己的晚年多存一分底气。\n\n如果你觉得这期内容对你有帮助，点个赞，转发给你身边还没开始规划养老的朋友。\n评论区留下你的年龄和月收入，我帮你算你的养老缺口有多大。\n我是孟卉，关注我，养老路上不走弯路。","status":"todo","inToday":true},
{"id":"t12","title":"我从100个客户身上学到的养老教训：这5类人最容易掉坑","type":"long","category":"教训总结","duration":"9min","hook":"做了这么多年养老规划，服务过上百个客户，我发现最容易在养老这件事上踩坑的，是这5类人。今天我把这些血泪教训分享出来，希望你能提前避开。","tags":["养老教训","客户案例","避坑","五类人","深度"],"script":"【开场 0:00-1:00】\n大家好，我是孟卉。\n今天这期有点不一样。我想跟你分享的不是产品、不是政策、不是算账——是我从上百个客户的真实案例里，总结出来的养老教训。\n这些客户里有年薪百万的高管，有普通工薪族，有全职妈妈，有退休老人。\n他们踩过的坑，我希望你不要再踩。\n\n我在服务客户的过程中发现，最容易在养老这件事上出问题的，是以下5类人。看看你在不在其中。\n\n【第一类：总觉得还早的人 1:00-2:30】\n第一类人，也是人数最多的一类——总觉得还早的人。\n我才30岁，养老急什么？我才40岁，等孩子大了再说。我才50岁，还能再干十几年。\n\n我印象最深的一个客户，42岁，互联网大厂产品经理，年薪50万。第一次来找我的时候，我说咱们聊聊养老规划，他笑着说：还早呢，我先冲几年再说。\n三年后他又来找我，那时候45岁，被优化了。年薪从50万降到了20万。他跟我说：孟卉，我现在开始规划是不是晚了？\n\n晚不晚？不晚，但代价变大了。\n如果他42岁开始规划，每月投5000，到60岁账户里能有接近100万，每月领5000+。\n45岁才开始，同样每月5000，到60岁只有70多万，每月领不到4000。\n三年时间，同样的投入，结果差了20多万。这不是因为我算错了，是因为复利不等人的本质——时间越短，杠杆越小。\n\n教训：养老规划最好的时间是10年前，其次是今天。永远不要觉得还早。你觉得早的时候，恰恰是最该开始的时候。\n\n【第二类：只靠社保的人 2:30-4:00】\n第二类人——只靠社保的人。\n我经常遇到这样的客户：我有社保，退休后有养老金，为什么还要自己买？\n\n我给他们看一个数字：养老金替代率。目前全国平均只有40%-45%。你退休前月入1万，退休后社保给你4000-4500。\n够吗？如果你退休后没有任何房贷、不需要养孩子、身体完全健康——可能勉强够。但现实是：大部分人退休后还要帮孩子买房、带孙子、看病买药。\n\n我有个客户，退休前是国企中层，月入1.5万。退休后社保每月领5200。他跟我说：孟卉，我没想到退休后会这么紧。每个月到月底都要算着花。孙子过生日包个红包都要犹豫。\n这就是只靠社保的现实。它不是不够活，是不够体面地活。\n\n教训：社保是养老的底线，但不是上限。你想老了以后还吃得起馆子、旅得起游、给得起红包——这得靠你自己提前准备。\n\n【第三类：盲目相信高收益的人 4:00-5:30】\n第三类人——盲目相信高收益的人。\n这类人有个特点：他们愿意规划，但方向错了。他们把养老钱拿去买股票、买基金、买各种理财产品，追求高收益。\n\n我印象最深的一个客户，55岁，手里有200万积蓄。我说拿一部分买养老年金锁定现金流，他说：年化才3%？太低了，我理财能做到8%。\n一年后他来找我，200万变成了140万。他说：孟卉，我亏了60万。剩下的140万还能买养老金吗？\n\n这就是问题的关键。养老金的核心价值不是收益，是确定性。\n你老了以后最怕的不是收益率低，是钱没了。市场波动、投资失败、被骗——这些风险随着年龄增长只会越来越大。\n\n教训：养老的钱不是用来博收益的，是用来保命的。求稳不求高，确定性大于一切。\n\n【第四类：把钱全放在一个篮子里的人 5:30-7:00】\n第四类人——把钱全放在一个篮子里的人。\n这类客户分两种：一种是全部存银行，一种是把所有钱买了一份保险。\n\n先说全存银行的。前面讲过了，利率越来越低，存款实际购买力在缩水。而且老了以后看着账户余额一天天减少，那种焦虑感比没钱还难受。\n\n再说全部买保险的。我有个客户，把所有积蓄买了一份大额年金。结果第二年家里老人突发疾病，急需20万手术费。年金取不出来，退保要亏十几万。最后只能借钱。\n养老金的规划，最忌讳的就是把鸡蛋放一个篮子里。\n\n教训：养老资产要分层配置。活期存款应急、增额寿灵活取用、养老年金锁定终身现金流。三个篮子都要有，比例可以根据年龄和需求调整。\n\n【第五类：为了孩子牺牲自己的人 7:00-8:30】\n最后一类人，也是最让人心疼的一类——为了孩子牺牲自己的人。\n\n我遇到过太多这样的父母：自己省吃俭用，把钱全给孩子买房、结婚、创业。然后跟我说：孟卉，我们老了随便过就行，孩子好我们就好。\n\n我每次听到这句话，心里都很难受。因为我见过太多这样的老人，老了以后活得很卑微。\n孩子过得好不好，跟老人过得好不好，是两回事。你把钱都给了孩子，老了以后每月伸手要钱的时候，那种感觉——你想象一下。\n\n我有个客户阿姨，65岁，把一辈子积蓄200万全给儿子买房了。自己每月社保只有1800块。\n她跟我说：孟卉，我现在每次去儿子家，儿媳妇的脸色都不一样。我买个菜都要跟儿子开口。我后悔了，真的后悔了。\n\n教训：爱孩子和爱自己不矛盾。你可以帮孩子，但不能把养老的底牌全交出去。\n给自己留一份养老金，不是自私，是对孩子的另一种爱——不让他们为你的晚年焦虑。\n\n【结尾 8:30-9:00】\n五类人说完了：总觉得还早的、只靠社保的、盲目追求高收益的、把钱放一个篮子里的、为孩子牺牲自己的。\n你在哪一类？或者说，你身边有没有这样的人？\n\n养老这件事，最怕的不是没钱，是不愿意面对。\n今天这期内容，如果你觉得有用，转发给你在乎的人。\n评论区聊聊：你觉得自己最需要警惕的是哪一类坑？\n我是孟卉，关注我，养老路上帮你避开每一个坑。","status":"todo","inToday":true},
{"id":"p1","title":"社保补缴全攻略：断缴了还能补吗？怎么补最省钱？","type":"short","category":"算账型","duration":"70s","hook":"社保断缴了好几年，还能补回来吗？补缴到底要花多少钱？今天一次性给你讲清楚。","tags":["社保补缴","断缴","灵活就业","算账"],"script":"【开头-钩子】\n社保断缴了，还能补吗？怎么补最省钱？这是被问最多的社保问题之一。今天我把补缴的规则、成本和策略一次性说透。\n\n【痛点/数据展开】\n先说结论：职工养老保险大部分城市不支持跨年补缴，只能从现在开始往后交。但城乡居民养老保险可以一次性补缴。\n\n职工养老：如果你断缴3年，这3年大部分城市补不了，只能认。但好消息是——缴费年限是累计计算的，断缴不归零。你之前交的5年还是5年，从你重新开始交的那天继续累加。\n\n居民养老：可以一次性补缴15年。以某省为例，按最高档5000元/年补15年，总费用7.5万。60岁后每月能领800-1000元，7年左右回本。\n\n但注意：补缴没有政府补贴！正常按年交的话，政府每年会补贴几十到几百块，补缴就没有这部分了。\n\n【解决方案/核心观点】\n所以最优策略是：\n第一，职工社保断缴的，马上恢复缴费，别等。越早续上，累计年限越多。\n第二，居民社保可以补缴，但尽量按年交，拿政府补贴。\n第三，如果到退休年龄还差几年，可以一次性趸交补齐——但各地政策不同，提前咨询当地社保局。\n\n【金句收尾】\n社保断缴不可怕，可怕的是断了就不管了。断了就续上，路还在。\n\n【行动号召】\n你的社保有断缴吗？评论区：断缴几年+城市，我帮你查当地补缴政策。","status":"pool","inToday":false},
{"id":"p2","title":"全职妈妈养老困局：你的付出，谁来买单？","type":"short","category":"情感共鸣","duration":"72s","hook":"全职妈妈的价值被严重低估了。我今天说几句可能会得罪人的话——但你一定要听完。","tags":["全职妈妈","女性养老","情感","养老规划"],"script":"【开头-钩子】\n全职妈妈，我接触最多的客户群体之一。\n每次跟她们聊养老，我都会听到同一句话：我又没工作，有什么好规划的。\n每次听到这句话，我都想拍桌子。\n\n【痛点/数据展开】\n你知道全职妈妈的养老风险有多大吗？\n首先，大部分全职妈妈没有自己的社保。老公有，但那在法律上是个人财产，不是夫妻共同财产。万一——我不想说那个万一——但万一离婚了、万一老公先走了，你能靠什么养老？\n其次，全职妈妈的劳动价值每年超过10万——带孩子、做家务、照顾老人，24小时待命。但养老金体系不认这笔账。你为家庭贡献了全部，老了以后每月只有几百块居民养老金。\n最后，很多全职妈妈到50岁才开始慌。但那时候买商业养老金已经晚了——保费高、可选产品少、回旋余地小。\n\n【解决方案/核心观点】\n全职妈妈怎么给自己养老？三件事，现在就能做：\n第一，以灵活就业身份交职工社保养老。哪怕按最低档，每月几百块，交满15年退休后每月也有1500-2000。这笔钱是你自己的，谁也拿不走。\n第二，买一份养老年金。每年交1-3万，交10-15年，60岁开始每月领1000-2000。受益人写自己。\n第三，跟老公坦诚谈钱。让他明白——给你买养老金不是不信任婚姻，是给你们的婚姻买保险。\n\n【金句收尾】\n全职妈妈最需要的不是老公的承诺，是自己名下的现金流。\n爱别人的前提，是先给自己穿上救生衣。\n\n【行动号召】\n全职妈妈们，评论区扣1，我帮你做一份专属养老方案。","status":"pool","inToday":false},
{"id":"p3","title":"分红险的底层逻辑：为什么有人赚有人亏？","type":"short","category":"避坑指南","duration":"75s","hook":"分红险到底靠不靠谱？今天我把保险公司不会告诉你的底层逻辑，拆开了给你看。","tags":["分红险","底层逻辑","避坑","分红实现率"],"script":"【开头-钩子】\n分红险，保险界最两极分化的产品。有人买了说真香，有人买了说被坑惨了。\n到底谁在说真话？今天不站队，把底层逻辑拆开给你看。\n\n【痛点/数据展开】\n分红险的收益分两块：保证部分+浮动分红。保证部分写进合同，浮动分红取决于保险公司投资表现。\n分红从哪来？保险公司通过三差赚钱：死差（实际死亡率比预期低省下的）、费差（运营成本比预期低省下的）、利差（投资收益比预期高多赚的）。\n理论上，三差都赚钱，分红就多。但实际上，保险公司主要靠利差赚钱——也就是投资收益。\n所以分红险好不好，不看产品看公司。公司的投资能力决定了你的分红。\n但问题是——大部分销售在卖分红险的时候，只给你看高收益演示，不告诉你分红是不保证的。\n\n怎么查一家保险公司的分红靠谱程度？看三个指标：\n第一，分红实现率。过去5-10年，承诺的分红兑现了多少？低于80%的要警惕。\n第二，投资收益率。保险公司年报里会披露，稳定在5%以上的算优秀。\n第三，偿付能力充足率。低于150%的公司别碰，说明它自身资金紧张。\n\n【解决方案/核心观点】\n分红险不是不能买，是要会选。\n选公司比选产品重要十倍。大公司、国资背景、历史分红实现率稳定的，优先考虑。\n另外，不要把全部养老钱都放分红险——它是锦上添花，不是雪中送炭。\n\n【金句收尾】\n买分红险就是买保险公司。\n公司会赚钱，你才有分红。公司不赚钱，你只有保证收益——还不一定比定存高。\n\n【行动号召】\n你买过分红险吗？评论区扣分红，我教你查你买的那家公司的分红实现率。","status":"pool","inToday":false},
{"id":"p4","title":"体制内养老金并轨后，铁饭碗还铁吗？","type":"short","category":"政策解读","duration":"68s","hook":"2024年养老金并轨完成后，公务员的退休金真的降了吗？真相来了。","tags":["养老金并轨","体制内","职业年金","政策"],"script":"【开头-钩子】\n2024年10月，养老金并轨正式完成。体制内和体制外，退休金计算方式统一了。\n很多人拍手叫好：终于公平了！但真相真的是这样吗？\n\n【痛点/数据展开】\n先说变化：并轨前，体制内不用自己交养老金，退休金按退休前工资的80%-90%发放。并轨后，体制内也要每月从工资扣8%交养老保险，退休金计算方式跟企业一样。\n表面看差距缩小了。但你仔细看——体制内多了一个东西叫职业年金。单位和个人各交一部分，退休后每月额外领取。\n\n举个例子：一个公务员退休前月薪1万，并轨后：社保养老金约3500-4000元，职业年金约1500-2000元，合计约5000-6000元。\n同样收入的企业职工：社保养老金约3500-4000元，没有职业年金。差距还有2000左右。\n\n所以结论是：并轨缩小了差距，但没有消除差距。体制内的优势从不用交变成了多了一份职业年金。\n\n【解决方案/核心观点】\n普通人怎么办？你没有职业年金，但你可以自己给自己建一个。商业养老年金就是普通人的职业年金。\n体制内的人多一份职业年金是制度红利，你多一份商业年金是你自己的选择。结果是一样的——退休后每月多领一笔钱。\n\n【金句收尾】\n不要羡慕体制内的铁饭碗，给自己打造一个终身现金流，比任何铁饭碗都靠谱。\n因为铁饭碗是别人给的，现金流是你自己挣的。\n\n【行动号召】\n你是体制内还是体制外？评论区聊聊你的养老规划！","status":"pool","inToday":false},
{"id":"p5","title":"给孩子买养老金，是爱还是傻？","type":"short","category":"情感共鸣","duration":"70s","hook":"给孩子买养老金？孩子才几岁！你是不是傻？——这是我最常听到的质疑。今天我想认真回答。","tags":["孩子养老金","复利","情感","长期规划"],"script":"【开头-钩子】\n给孩子买养老金，你是不是疯了？\n这句话我听过太多次了。但今天我想认真地告诉你，为什么我认为给孩子买养老金，可能是你能给他的最好的礼物。\n\n【痛点/数据展开】\n先算一笔账。假设你想让孩子60岁以后每月领1万块养老金。\n如果他从30岁开始自己存：每月需要存2500块，存30年。\n如果他从0岁开始、你帮他存：每月只需要存400块，存30年（0-30岁期间你的投入），然后这笔钱在30-60岁之间自己复利增长。\n\n看到了吗？同样的结果，时间差30年，成本差6倍。\n这就是复利最神奇的地方——它奖励的不是有钱人，是有远见的人。\n\n你可能说：孩子才几岁，考虑养老是不是太远了？\n但你想过没有——我们这一代人，可能是最后一代能给父母养老的，也是第一代不能指望孩子养老的。\n你的孩子将来要面对比我们更严峻的养老压力：人口更少、社保更薄、房价更高。\n你现在每月花几百块，换他60岁以后每月有一笔雷打不动的收入——这不叫傻，这叫用时间复利去爱他。\n\n【解决方案/核心观点】\n给孩子买养老金的操作很简单：以孩子为被保险人，你作为投保人缴费，买一份养老年金。\n孩子60岁以后开始领钱，活多久领多久。中途如果你想用钱，也可以退保取现价。\n每年几千到几万都可以，丰俭由人。关键是开始得早。\n\n【金句收尾】\n给孩子最好的礼物不是一套房、一辆车，是一个不用为养老焦虑的人生。\n你现在存下的一分钱，30年后会替你说一句：孩子，别怕。\n\n【行动号召】\n想了解给孩子买养老金怎么操作？评论区扣孩子年龄，我帮你出方案。","status":"pool","inToday":false},
{"id":"p6","title":"返还型保险的真相：为什么我从不推荐","type":"short","category":"避坑指南","duration":"68s","hook":"有病治病没病返本，这句话骗了多少中国家庭？今天我把返还型保险的账算给你看。","tags":["返还型保险","避坑","消费型","对比"],"script":"【开头-钩子】\n有病治病，没病返本——这句话你听过吗？\n保险销售最经典的套路之一，也是最有效的套路。为什么有效？因为它精准击中了中国人不爱亏的心理。\n但今天我要告诉你，这句话背后藏着一个巨大的陷阱。\n\n【痛点/数据展开】\n返还型保险的逻辑很简单：你每年多交一笔钱，保险公司拿这笔钱去投资。到合同期满，如果你没理赔，保险公司把多交的钱加上一点收益返还给你。\n\n听起来不亏？算笔账就清楚了。\n同样保额50万的终身重疾险：消费型每年保费约3000元，返还型每年保费约8000元。\n你每年多交了5000元，交30年就是多交了15万。30年后，保险公司返还你大概18-20万。\n看起来赚了3-5万？但你把这每年5000元自己理财，按3%复利，30年后本息合计约23.5万。\n\n也就是说，保险公司拿你的钱去投资赚了更多，然后分你一小部分作为返还。中间那部分利润，被保险公司吃了。\n\n【解决方案/核心观点】\n我的建议一直很明确：保险就是保险，理财就是理财，别混在一起。\n买消费型保险，保费低、保障高。剩下的钱自己理财或买养老金。\n这样你的保障不打折，你的理财收益也全部归自己。\n\n【金句收尾】\n返还型保险不是你占了保险公司便宜，是保险公司占了你不会算账的便宜。\n保险和理财分开买，比捆在一起买，至少多赚30%。\n\n【行动号召】\n你买过返还型保险吗？评论区聊聊你的体验，我帮你分析要不要退。","status":"pool","inToday":false},
{"id":"p7","title":"独生子女养老焦虑：我一个人怎么扛四个老人？","type":"short","category":"情感共鸣","duration":"72s","hook":"90后独生子女最怕的，不是房价，不是35岁裁员——是四个老人同时生病。这条视频可能会让你焦虑，但也会给你解决方案。","tags":["独生子女","养老焦虑","代际压力","情感"],"script":"【开头-钩子】\n90后独生子女最怕什么？\n不是房价，不是35岁被裁，不是找不到对象。\n是深夜接到电话，说爸妈住院了。\n\n【痛点/数据展开】\n一个90后独生子女，未来要面对的是：上面4个老人（双方父母），下面1-2个孩子，中间两个自己。\n这个结构叫做4-2-1或4-2-2，是全世界最脆弱的家庭结构。\n\n我们算一笔真实的账：如果4个老人每人每月需要5000块养老加医疗费用，一年就是24万。\n如果你和伴侣两个人月入合计3万，去掉房贷1万、孩子教育5000、生活开支8000，还剩7000。\n24万除以12个月等于每月2万——你根本扛不住。\n\n这不是焦虑贩卖，这是数学题。答案摆在面前，不看也得看。\n\n【解决方案/核心观点】\n独生子女养老，不能等到父母生病了才面对。三件事，现在就必须做：\n第一，帮父母把社保和医保交上。居民养老和居民医保一定要有，这是兜底。\n第二，给父母配医疗险。百万医疗险每年几百到一千多，杠杆很高。如果父母身体条件买不了，就配防癌医疗险。\n第三，给自己买养老金。别让这个循环延续到下一代。你现在不给自己的养老做准备，你的孩子将来就要面对更重的负担。\n\n【金句收尾】\n我们这一代独生子女，是最后一代能给父母养老的人，也是第一代不能指望孩子养老的人。\n给自己存养老金不是自私，是对孩子最大的爱。\n\n【行动号召】\n独生子女们，评论区扣1，聊聊你的养老焦虑。我帮你看看你的家庭怎么配置最合理。","status":"pool","inToday":false},
{"id":"p8","title":"日本养老启示录：低利率30年，普通人怎么过的？","type":"short","category":"数据冲击","duration":"72s","hook":"日本经历了30年低利率，存款利息接近零。日本老人的养老现状，就是我们的未来预告片。","tags":["日本养老","利率","启示","老龄化"],"script":"【开头-钩子】\n日本的今天，很可能就是中国的明天。\n日本从1990年代开始进入低利率时代，一直持续了30多年。存款利率长期接近零，老龄化率全球第一。\n日本老人的养老现状，就是给我们上的最真实的一课。\n\n【痛点/数据展开】\n几个扎心的数据：\n第一，日本65岁以上老人占总人口29%，每3个人里就有一个老人。中国现在21%，正在快速追赶。\n第二，日本养老金替代率约40%，跟中国差不多。但日本物价高、医疗贵，很多退休老人每月养老金只够基本吃饭。\n第三，日本有一个现象叫下流老人——不是道德意义上的下流，是生活水平持续下滑的老人。他们养老金不够用、没有存款、没有子女赡养。\n第四，日本出现了老年打工潮。很多70多岁的老人还在便利店打工、开出租车。不是热爱工作，是不工作就没饭吃。\n\n【解决方案/核心观点】\n日本给我们的启示有三条：\n第一，别指望利率会涨回去。低利率是长期趋势，越早锁利越好。\n第二，别只靠社保。日本社保体系比我们完善，但替代率也只有40%。中国的社保未来不会比日本更好。\n第三，别等老了再说。日本那些下流老人，年轻的时候也是觉得养老还早的人。\n\n【金句收尾】\n日本老人今天的生活，就是我们30年后的预演。\n现在看日本养老是看新闻，以后看自己养老就是看现实。\n\n【行动号召】\n你觉得中国的养老会走日本的老路吗？评论区聊聊你的看法。","status":"pool","inToday":false},
{"id":"p9","title":"养老社区对比：泰康vs国寿vs太平，谁家更值得？","type":"short","category":"对比","duration":"75s","hook":"想住高端养老社区？泰康、国寿、太平三家对比，价格、服务、门槛一次说清。","tags":["养老社区","泰康","国寿","对比","高端养老"],"script":"【开头-钩子】\n很多朋友问我：孟卉，你去看过那些高端养老社区吗？到底值不值得？\n我去过不止一次。泰康之家、国寿嘉园、梧桐人家，我全部实地看过。今天把对比结果告诉你。\n\n【痛点/数据展开】\n先说泰康之家：目前国内最高端的养老社区品牌。环境一流、医疗配套完善、老年大学课程丰富。但门槛也最高——需要买至少200万以上保费的年金产品才能获得入住资格。入住后每月费用8000-15000元。适合高净值家庭。\n\n国寿嘉园：中国人寿旗下的养老社区。相比泰康，门槛低一些，100-150万保费可以获得入住资格。服务和环境属于中高端水平，性价比不错。适合中高收入家庭。\n\n太平梧桐人家：太平人寿的养老社区。门槛在80-120万左右，分布城市更多，二线城市也有覆盖。服务标准中等偏上，价格适中。\n\n【解决方案/核心观点】\n选养老社区看四点：\n第一，城市分布。你家附近有没有？别买了上海的社区你住北京。\n第二，医疗配套。养老社区最值钱的是医疗资源，有没有自建医院、三甲合作。\n第三，护理服务。不能自理以后，社区能不能提供专业护理？这是关键。\n第四，费用透明度。月费多少、护理费多少、押金多少，全部问清楚。\n\n【金句收尾】\n养老社区买的不是房子，是医疗、护理和尊严。\n选对了，晚年是享受。选错了，晚年是煎熬。\n\n【行动号召】\n你想了解哪家养老社区？评论区告诉我，我帮你分析。","status":"pool","inToday":false},
{"id":"p10","title":"退休后你的收入来源有几个？大多数人只有一个","type":"short","category":"算账型","duration":"68s","hook":"你退休后的收入来源有几个？我调研了100个人，80%的人只有一个——社保。这就好比走路只有一条腿。","tags":["退休收入","多元化","收入来源","养老规划"],"script":"【开头-钩子】\n问你一个问题：你退休以后，每个月钱从哪里来？\n我调研过上百个人，80%的人答案是——社保养老金。\n这就好比走路只有一条腿，走不稳。\n\n【痛点/数据展开】\n理想的退休收入应该有四个来源：\n第一，社保养老金——底线收入，覆盖基本生活。\n第二，企业年金或职业年金——大部分人没有。\n第三，个人商业养老金——你自己提前配置的年金险和增额寿。\n第四，其他收入——房租、股息、兼职、子女赡养等。\n\n四个来源加起来，才能保证退休生活的品质。但现实是：大部分中国人只有第一个，少数人有第四个，第二和第三几乎空白。\n这就导致一个问题——你的退休生活质量，完全取决于社保养老金的水平。而社保养老金的替代率只有40%-45%，还在逐年下降。\n\n【解决方案/核心观点】\n怎么增加退休收入来源？\n第一，现在开始建第二个来源——个人养老金账户，每年12000额度。\n第二，建第三个来源——商业养老年金。每年投入1-5万，退休后每月多领几千。\n第三，如果有条件，建第四个来源——投资一套小户型出租，或者定投指数基金长期持有。\n\n目标不是发财，是让退休后每月到账的钱至少有2-3个来源。一个来源断了，还有别的撑着。\n\n【金句收尾】\n退休生活最怕的不是钱少，是只有一个来源的钱少。\n多条腿走路，才走得稳、走得远。\n\n【行动号召】\n你退休后的收入来源有几个？评论区聊聊，我帮你分析还缺什么。","status":"pool","inToday":false},
{"id":"p11","title":"以房养老靠谱吗？房产养老的三大陷阱","type":"short","category":"避坑指南","duration":"70s","hook":"以房养老，听上去很美——一套房子换晚年无忧。但现实里的坑，可能让你血本无归。","tags":["以房养老","房产","避坑","养老规划"],"script":"【开头-钩子】\n我有房，老了卖掉就行，不用买养老金。\n这句话我听了太多遍。但今天我要告诉你，以房养老这件事，可能没你想的那么美。\n\n【痛点/数据展开】\n以房养老有三种方式，各有各的坑。\n\n第一种：卖房养老。把房子卖了拿现金养老。坑在哪？第一，你卖房的时点不确定。急用钱的时候可能市场不好，折价卖。第二，现金拿在手里，老人容易被骗、被借、被啃老。第三，房子卖了住哪？租房？养老院？这些都要钱。\n\n第二种：以房养老反向抵押。把房子抵押给保险公司，每月领养老金，死后房子归保险公司。坑在哪？目前国内只有少数城市试点，产品少、评估价低、实际到手金额有限。\n\n第三种：出租养老。房子租出去，用租金养老。坑在哪？租金不稳定、租客麻烦、房子维护成本高。年纪大了根本管不过来。\n\n【解决方案/核心观点】\n房产可以作为养老的补充，但不能作为唯一的依靠。\n我的建议是：房产+社保+商业养老金，三管齐下。\n房产提供一笔大额资产，社保提供底线收入，商业养老金提供稳定现金流。三者结合，才是完整的养老方案。\n\n【金句收尾】\n房子是资产，但不是现金流。老了以后你需要的不是一套房子，是每个月准时到账的钱。\n\n【行动号召】\n你考虑过以房养老吗？评论区聊聊你的想法，我帮你分析是否可行。","status":"pool","inToday":false},
{"id":"p12","title":"丁克家庭养老指南：没有孩子，老了怎么办？","type":"short","category":"方案型","duration":"72s","hook":"选择丁克的人越来越多。但有一个问题你必须面对：没有孩子，老了谁管你？今天给丁克家庭一份完整的养老方案。","tags":["丁克","养老规划","护理","方案"],"script":"【开头-钩子】\n选择丁克，是个人的自由。但有一个现实问题绕不开——没有孩子，老了以后谁照顾你？\n今天这期视频，专门给丁克家庭。我不贩卖焦虑，只给你解决方案。\n\n【痛点/数据展开】\n丁克家庭的养老风险有三个方面：\n第一，经济风险。没有子女的经济支持，全部靠自己。退休后收入一旦下降，生活品质直接打折。\n第二，护理风险。老了以后生病、失能，谁来照顾？请护工每月6000-8000，20年护理费用轻松上百万。\n第三，决策风险。老了以后谁来帮你做医疗决策、财产管理？如果没有可信赖的人，你的晚年可能被陌生人掌控。\n\n【解决方案/核心观点】\n丁克家庭的养老规划要比有孩子的家庭更早、更全、更足。\n\n第一步：经济准备要加码。社保必须交、商业养老金必须买、个人养老金账户存满。目标是在60岁以后每月有8000-10000的稳定现金流。\n第二步：护理保障要提前锁定。买一份长期护理险，或者选择有护理配套的养老社区。不能自理以后，专业护理比什么都重要。\n第三步：法律安排要做好。立遗嘱、设定意定监护、指定财产管理人。这些看起来不吉利，但能保证你老了以后的决定权还在自己手里。\n\n【金句收尾】\n没有孩子不可怕，可怕的是没有计划。\n丁克不是问题，不规划才是问题。\n\n【行动号召】\n你是丁克吗？评论区聊聊你对养老的打算，我帮你分析你的规划够不够。","status":"pool","inToday":false},
{"id":"p13","title":"AI时代的保险：人工智能会替代保险经纪人吗？","type":"short","category":"行业思考","duration":"68s","hook":"AI会替代保险经纪人吗？我认真思考了这个问题，答案可能和你想的不一样。","tags":["AI","保险","行业趋势","经纪人"],"script":"【开头-钩子】\n最近总有人问我：孟卉，AI发展这么快，你们保险经纪人是不是要失业了？\n我认真想了这个问题，答案是：AI会改变这个行业，但替代不了我。\n\n【痛点/数据展开】\nAI能做什么？它能算收益率、能对比产品、能生成方案、能回答标准问题。这些确实比人快、比人准。\n但AI做不了什么？\n第一，AI理解不了你的恐惧。你深夜想到老了没钱怎么办的那种焦虑，AI不会懂。\n第二，AI不会在你说出真实顾虑时给你一个理解的眼神。很多人来找我，嘴上说想买养老金，心里怕的是被老公抛弃、被孩子嫌弃、被社会遗忘。这些AI读不出来。\n第三，AI不能替你做决定。养老金一买就是二三十年，这种重大决策需要的不是一个计算结果，是一个人告诉你：我见过几百个案例，你这样做是对的。\n\n【解决方案/核心观点】\n未来的保险经纪人，不会被AI替代，但会被会用AI的经纪人替代。\n我现在已经开始用AI辅助做数据分析、产品对比，把更多时间留给跟客户面对面沟通。\nAI是工具，共情是能力。工具可以学，能力长在人身上。\n\n【金句收尾】\nAI可以告诉你哪个产品收益最高，但我能告诉你哪个产品最适合你。\n这两句话的差距，就是人和机器的差距。\n\n【行动号召】\n你觉得AI会替代保险经纪人吗？评论区聊聊你的看法。","status":"pool","inToday":false},
{"id":"p14","title":"香港保险vs内地保险：养老金买哪个更划算？","type":"short","category":"对比","duration":"75s","hook":"香港保险被吹上天，内地保险被踩到底。到底养老金该买哪个？我帮你客观对比。","tags":["香港保险","对比","养老金","跨境"],"script":"【开头-钩子】\n香港保险vs内地保险，这个话题争议很大。有人说香港产品收益高、分红好，有人说汇率风险大、理赔麻烦。\n今天我不吹不黑，帮你客观对比。\n\n【痛点/数据展开】\n先说香港保险的优势：\n第一，分红实现率更高。香港头部保险公司历史分红实现率普遍在90%-100%，内地有些公司只有70%-80%。\n第二，美元计价。如果你未来有海外用钱需求——孩子留学、移民养老——美元保单天然对冲汇率风险。\n第三，产品更灵活。香港的储蓄分红险支持多币种转换、保单分拆等功能。\n\n再说香港保险的劣势：\n第一，汇率风险。如果你长期在内地生活、用人民币消费，美元保单的汇率波动可能吃掉你的收益。\n第二，购买成本高。需要亲自去香港签单，来回机票酒店加上时间成本不低。\n第三，法律差异。香港保单受香港法律管辖，发生纠纷需要去香港处理。\n\n【解决方案/核心观点】\n怎么选？看你的需求：\n如果你的生活和消费都在内地——买内地产品。方便、合规、省心。\n如果你有海外资产配置需求、未来可能移居或孩子留学——可以配置一部分香港产品做对冲。\n如果你资金量大——两地各配一部分，分散风险。\n\n【金句收尾】\n香港保险和内地保险不是谁好谁坏的问题，是谁适合你的问题。\n买保险不是追潮流，是匹配需求。\n\n【行动号召】\n你考虑过买香港保险吗？评论区聊聊你的想法，我帮你分析适合不适合。","status":"pool","inToday":false},
{"id":"p15","title":"中年人失业后，养老怎么办？40-50岁最残酷的养老真相","type":"short","category":"情感共鸣","duration":"72s","hook":"40岁被裁员，房贷还没还完，孩子正在上学，父母开始生病。这时候谈养老，是不是太奢侈了？","tags":["中年危机","失业","养老焦虑","40岁","情感"],"script":"【开头-钩子】\n40岁被裁，房贷30年，孩子上初中，父母刚查出来高血压。\n这时候你跟我谈养老——你是不是觉得我站着说话不腰疼？\n\n今天这期，我不回避任何残酷。专门写给正处于中年危机的人。\n\n【痛点/数据展开】\n先说一个残酷的事实：35-45岁是大多数人收入的巅峰期，45岁以后收入大概率下降。\n如果你在40岁失业了，再找一份同等收入的工作，难度是30岁的3-5倍。\n这不是歧视，是市场规律——企业觉得年轻人更便宜、更能加班、更好管理。\n\n这时候养老怎么办？\n第一，不要停社保。失业了以灵活就业身份继续交社保养老，最低档也要交。断缴一天，将来退休金就少一分。\n第二，不要动养老钱。很多人失业后第一件事就是把之前存的养老金取出来应急。这是饮鸩止渴。养老钱是底线，除非万不得已不要动。\n第三，降低预期但别放弃。你可能没法按原计划每月存3000养老了，但每月存500也是存。存500比存0好一万倍。\n\n【解决方案/核心观点】\n中年人失业后最需要的不是高收益方案，是不断缴、不放弃、不绝望。\n社保续上，小额养老继续交，同时积极找工作、调整心态。\n你还有20年时间到60岁。20年足够让复利帮你扭转局面。\n\n【金句收尾】\n中年失业不可怕，可怕的是因为眼前的困难放弃了未来的自己。\n给60岁的你留一条后路，哪怕这条路现在看起来很窄。\n\n【行动号召】\n你经历过中年失业吗？评论区聊聊你的故事，你不是一个人在扛。","status":"pool","inToday":false}
];

// ========== STATE ==========
var tab = 'today';
var cat = 'all', tag = 'all';
var filtered = [];

var TABS = [
  {id:'today',icon:'📅',label:'今日'},
  {id:'pool',icon:'📚',label:'备选池'},
  {id:'history',icon:'📜',label:'已拍'},
  {id:'all',icon:'🗂',label:'全部'}
];

var CATS = ['全部','热点追踪','政策解读','算账型','对比','情感共鸣','避坑指南','方案型','反常识','人设立','冷知识','故事驱动','反向营销'];
var TAGS = ['全部','养老规划','年金险','社保','增额寿','分红险','养老金','女性养老','热点','算账','复利','信任'];

// ========== STORAGE ==========
function saveState() {
  var states = {};
  SCRIPTS.forEach(function(s){ states[s.id] = {status:s.status, inToday:s.inToday}; });
  try { localStorage.setItem('mh_v3_states', JSON.stringify(states)); } catch(e){}
}
function loadState() {
  try {
    var raw = localStorage.getItem('mh_v3_states');
    if (!raw) return;
    var states = JSON.parse(raw);
    SCRIPTS.forEach(function(s){
      if (states[s.id]) { s.status = states[s.id].status; s.inToday = states[s.id].inToday; }
    });
  } catch(e){}
}

// ========== RENDER ==========
function $(id){ return document.getElementById(id); }

function init() {
  loadState();

  var now = new Date();
  $('hdDate').innerHTML = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日<br>星期'+'日一二三四五六'[now.getDay()];

  // Bottom nav
  $('nvBar').innerHTML = TABS.map(function(t){
    return '<div class="ni'+(t.id===tab?' on':'')+'" onclick="switchTab(\''+t.id+'\')"><span class="ni-i">'+t.icon+'</span>'+t.label+'</div>';
  }).join('');

  // Category chips
  $('catCh').innerHTML = CATS.map(function(c){
    var v = c==='全部'?'all':c;
    return '<span class="ch-i'+((v===cat)?' on':'')+'" onclick="setCat(\''+v+'\')">'+c+'</span>';
  }).join('');

  // Tag chips
  $('tagCh').innerHTML = TAGS.map(function(t){
    var v = t==='全部'?'all':t;
    return '<span class="ch-i'+((v===tag)?' on':'')+'" onclick="setTag(\''+v+'\')">'+t+'</span>';
  }).join('');

  $('srInp').addEventListener('input', function(){ doFilter(); });
  doFilter();
}

function doFilter() {
  var search = $('srInp').value.toLowerCase();
  var list = SCRIPTS.slice();

  if (tab === 'today') list = list.filter(function(s){return s.inToday;});
  else if (tab === 'pool') list = list.filter(function(s){return s.status==='pool';});
  else if (tab === 'history') list = list.filter(function(s){return s.status==='done'||s.status==='pending';});

  if (cat !== 'all') list = list.filter(function(s){return s.category.indexOf(cat)>=0;});
  if (tag !== 'all') list = list.filter(function(s){return s.tags.some(function(t){return t.indexOf(tag)>=0;});});
  if (search) list = list.filter(function(s){
    return s.title.toLowerCase().indexOf(search)>=0 || s.hook.toLowerCase().indexOf(search)>=0 || s.script.toLowerCase().indexOf(search)>=0 || s.tags.some(function(t){return t.toLowerCase().indexOf(search)>=0;});
  });

  filtered = list;
  renderList();
  renderStats();
}

function renderStats() {
  var pool=0, todo=0, done=0, pending=0;
  var todayShort=0, todayLong=0, shortDone=0, longDone=0;
  SCRIPTS.forEach(function(s){
    if(s.status==='pool')pool++;
    if(s.status==='todo')todo++;
    if(s.status==='done')done++;
    if(s.status==='pending')pending++;
    if(s.inToday){
      if(s.type==='short'){todayShort++; if(s.status==='done')shortDone++;}
      else{todayLong++; if(s.status==='done')longDone++;}
    }
  });

  $('stRow').innerHTML =
    '<div class="st-i"><div class="st-v" style="color:var(--p)">'+pool+'</div><div class="st-l">📚备选池</div></div>'+
    '<div class="st-i"><div class="st-v" style="color:var(--g)">'+todo+'</div><div class="st-l">⏳待拍</div></div>'+
    '<div class="st-i"><div class="st-v" style="color:#2e7d32">'+done+'</div><div class="st-l">✅已拍</div></div>'+
    '<div class="st-i"><div class="st-v" style="color:var(--a)">'+pending+'</div><div class="st-l">📤待发</div></div>';

  $('pgRow').innerHTML =
    '<div class="pg-r"><span class="pg-l">📱短视频</span><div class="pg-b"><div class="pg-f" style="width:'+(todayShort?Math.round(shortDone/todayShort*100):0)+'%;background:var(--p)"></div></div><span class="pg-n">'+shortDone+'/'+todayShort+'</span></div>'+
    '<div class="pg-r"><span class="pg-l">🎬长视频</span><div class="pg-b"><div class="pg-f" style="width:'+(todayLong?Math.round(longDone/todayLong*100):0)+'%;background:var(--g)"></div></div><span class="pg-n">'+longDone+'/'+todayLong+'</span></div>';
}

function renderList() {
  var el = $('lsEl');
  $('ctEl').textContent = '共 '+filtered.length+' 条';
  if (!filtered.length) { el.innerHTML = '<div class="em2"><div class="ei">📭</div>暂无内容</div>'; return; }

  el.innerHTML = filtered.map(function(s){
    var ck = (s.status==='done'||s.status==='pending')?' d':'';
    var tb = s.type==='short'?'<span class="bg bs">📱短视频</span>':'<span class="bg bl">🎬长视频</span>';
    var sb = '';
    if(s.status==='done') sb='<span class="bg bd">✅已拍</span>';
    if(s.status==='pending') sb='<span class="bg bd">📤待发</span>';
    if(s.status==='pool') sb='<span class="bg bp">📚备选</span>';

    var act = '';
    if(s.status==='pool') act='<button class="ab" onclick="event.stopPropagation();toggleToday(\''+s.id+'\',true)">📅</button>';
    else if(s.status==='todo') act='<button class="ab" onclick="event.stopPropagation();toggleToday(\''+s.id+'\',false)">📚</button>';

    return '<div class="it" onclick="openModal(\''+s.id+'\')">'+
      '<div class="it-t">'+
        '<div class="ck'+ck+'" onclick="event.stopPropagation();cycleStatus(\''+s.id+'\')"></div>'+
        '<div class="it-i">'+
          '<div class="it-tt">'+s.title+' '+sb+'</div>'+
          '<div class="it-hk">'+s.hook+'</div>'+
          '<div class="it-m">'+tb+'<span class="mt">⏱'+s.duration+'</span><span class="mt">'+s.category+'</span>'+
            s.tags.slice(0,2).map(function(t){return '<span class="mt">#'+t+'</span>';}).join(' ')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="it-a">'+act+'</div>'+
    '</div>';
  }).join('');
}

// ========== ACTIONS ==========
function switchTab(t) {
  tab = t;
  document.querySelectorAll('.ni').forEach(function(el,i){ el.classList.toggle('on', TABS[i].id===t); });
  doFilter();
}

function setCat(c) {
  cat = c;
  document.querySelectorAll('#catCh .ch-i').forEach(function(el){
    var v = el.textContent==='全部'?'all':el.textContent;
    el.classList.toggle('on', v===c);
  });
  doFilter();
}

function setTag(t) {
  tag = t;
  document.querySelectorAll('#tagCh .ch-i').forEach(function(el){
    var v = el.textContent==='全部'?'all':el.textContent;
    el.classList.toggle('on', v===t);
  });
  doFilter();
}

function cycleStatus(id) {
  var s = SCRIPTS.find(function(x){return x.id===id;});
  if(!s || s.status==='pool') return;
  s.status = s.status==='todo'?'done':s.status==='done'?'pending':'todo';
  saveState();
  toast({done:'✅ 已完成',pending:'📤 待发送',todo:'🔄 待拍摄'}[s.status]);
  doFilter();
}

function toggleToday(id, inToday) {
  var s = SCRIPTS.find(function(x){return x.id===id;});
  if(!s) return;
  s.inToday = inToday;
  s.status = inToday?'todo':'pool';
  saveState();
  toast(inToday?'📅 已加入今日':'📚 已移入备选');
  doFilter();
}

function openModal(id) {
  var s = SCRIPTS.find(function(x){return x.id===id;});
  if(!s) return;

  var acts = '<button class="bn bp2" onclick="copyScript(\''+id+'\')">📋 复制口播稿</button>';
  if(s.status==='todo') acts += '<button class="bn bo2 bs2" onclick="cycleStatus(\''+id+'\');closeModal()">✅ 标记完成</button>';
  if(s.status==='todo') acts += '<button class="bn bo2 bs2" onclick="toggleToday(\''+id+'\',false);closeModal()">📚 移入备选</button>';
  if(s.status==='pool') acts += '<button class="bn bo2 bs2" onclick="toggleToday(\''+id+'\',true);closeModal()">📅 加入今日</button>';
  acts += '<button class="bn bo2 bs2" onclick="exportToday()">📤 导出口播稿</button>';

  $('mmBox').innerHTML =
    '<div class="mh"><div class="mt2">'+s.title+'</div><button class="mc" onclick="closeModal()">×</button></div>'+
    '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">'+
      '<span class="bg '+(s.type==='short'?'bs':'bl')+'">'+(s.type==='short'?'📱短视频':'🎬长视频')+'</span>'+
      '<span class="mt">⏱'+s.duration+'</span><span class="mt">'+s.category+'</span>'+
    '</div>'+
    '<div class="mbd">'+s.script+'</div>'+
    '<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">'+s.tags.map(function(t){return '<span class="bg bs">#'+t+'</span>';}).join(' ')+'</div>'+
    '<div class="ma">'+acts+'</div>';

  $('mmMask').classList.add('s');
}

function closeModal() { $('mmMask').classList.remove('s'); }

function copyScript(id) {
  var s = SCRIPTS.find(function(x){return x.id===id;});
  if(!s) return;
  var ta = document.createElement('textarea');
  ta.value = s.script; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  toast('📋 口播稿已复制！');
}

function exportToday() {
  var today = SCRIPTS.filter(function(s){return s.inToday;});
  var text = '=== 卖保险的孟卉 · 今日口播稿 ===\n\n';
  today.forEach(function(s,i){ text += '--- '+(i+1)+'. '+s.title+' ('+s.duration+') ---\n'+s.script+'\n\n'; });
  var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = '孟卉口播稿.txt'; a.click();
  URL.revokeObjectURL(url);
  toast('📋 口播稿已导出！');
}

function toast(msg) {
  var el = $('tsEl');
  el.textContent = msg; el.classList.add('s');
  setTimeout(function(){ el.classList.remove('s'); }, 2000);
}

// Click outside modal to close
$('mmMask').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

// Start
init();
</script>
</body>
</html>
