<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8523a">
<title>孟卉的内容工作台</title>
<style>
  :root{
    --p:#e8523a;--a:#d63031;--g:#f0932b;--bg:#fff5f2;--card:#fff;
    --t:#2c2c2c;--tl:#999;--bd:#fce4dc;--sb:env(safe-area-inset-bottom,0px)
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--t);
    padding:calc(34px + env(safe-area-inset-top,0px)) 18px calc(46px + var(--sb));
    line-height:1.6;min-height:100vh
  }
  .hero{padding:6px 6px 4px}
  .hero .badge{display:inline-block;font-size:12px;color:var(--p);background:#fce4dc;
    padding:4px 12px;border-radius:20px;font-weight:600;margin-bottom:12px}
  .hero h1{font-size:27px;font-weight:800;letter-spacing:-.5px}
  .hero h1 .dot{color:var(--p)}
  .hero p{color:var(--tl);font-size:14px;margin-top:8px}
  .grid{margin-top:26px;display:flex;flex-direction:column;gap:16px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);
    border-radius:22px;padding:22px 20px;box-shadow:0 8px 24px rgba(232,82,58,.09);
    border:1px solid var(--bd);position:relative;overflow:hidden;transition:transform .18s ease}
  .card:active{transform:scale(.975)}
  .card .top{display:flex;align-items:center;gap:15px}
  .card .ico{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;
    justify-content:center;font-size:29px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .card.c1 .ico{background:linear-gradient(135deg,#e8523a,#f0932b)}
  .card.c2 .ico{background:linear-gradient(135deg,#6a5acd,#e8523a)}
  .card h2{font-size:19px;font-weight:700}
  .card .desc{color:var(--tl);font-size:13px;margin-top:3px;padding-right:24px}
  .card .arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);
    color:var(--p);font-size:24px;font-weight:300}
  .card .tags{margin-top:15px;display:flex;flex-wrap:wrap;gap:7px}
  .card .tag{font-size:11px;background:var(--bg);color:var(--tl);
    padding:4px 10px;border-radius:20px;border:1px solid var(--bd)}
  .foot{margin-top:30px;text-align:center;color:var(--tl);font-size:12px;line-height:1.8}
  .foot b{color:var(--p)}
</style>
</head>
<body>
  <div class="hero">
    <span class="badge">内容创作中心</span>
    <h1>孟卉的内容工作台<span class="dot">.</span></h1>
    <p>一个入口，管理你所有的内容创作</p>
  </div>

  <div class="grid">
    <a class="card c1" href="yanglao.html">
      <div class="top">
        <div class="ico">📋</div>
        <div>
          <h2>养老选题工作台</h2>
          <div class="desc">每日短视频选题 + 口播稿 + 备选池</div>
        </div>
      </div>
      <div class="tags">
        <span class="tag">10 短视频</span>
        <span class="tag">2 长视频</span>
        <span class="tag">15 备选</span>
        <span class="tag">拍摄状态追踪</span>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="card c2" href="pyq.html">
      <div class="top">
        <div class="ico">📱</div>
        <div>
          <h2>朋友圈工作台</h2>
          <div class="desc">每日朋友圈文案自动生成</div>
        </div>
      </div>
      <div class="tags">
        <span class="tag">保险感悟</span>
        <span class="tag">读书笔记</span>
        <span class="tag">家庭生活</span>
        <span class="tag">配图参考</span>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="foot">
    把本页添加到手机桌面，随时随地打开 →<br>
    <b>养老选题</b> 与 <b>朋友圈</b> 都在这里
  </div>
</body>
</html>
